<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>back_end_iraqi — لوحة اختبار API</title>
<style>
  :root {
    --bg: #f3f5f1;
    --panel: #ffffff;
    --panel-2: #f1f3ee;
    --sunken: #e8ece5;
    --border: #dde3d8;
    --border-strong: #c6cfc0;
    --text: #15201a;
    --text-dim: #56665c;
    --text-faint: #8b978f;
    --accent: #1d7a52;
    --accent-strong: #135f3e;
    --accent-soft: #e1f2e8;
    --on-accent: #f5fbf8;
    --info: #2b62a6;
    --info-soft: #e3ecf8;
    --violet: #6b4bb8;
    --violet-soft: #ece6f8;
    --warn: #9f5716;
    --warn-soft: #f7e9d7;
    --err: #b3311d;
    --err-soft: #f9e0db;
    --mono-bg: #0f1914;
    --mono-text: #d6e5db;
    --mono-dim: #7f9488;
    --shadow-sm: 0 1px 2px rgba(20, 30, 24, 0.06);
    --shadow: 0 1px 2px rgba(20, 30, 24, 0.05), 0 8px 24px rgba(20, 30, 24, 0.06);
    --radius: 12px;
    --radius-sm: 8px;
    --font: "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, -apple-system, sans-serif;
    --mono: Consolas, "SF Mono", Menlo, "Liberation Mono", monospace;
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --bg: #0a110e;
    --panel: #111a15;
    --panel-2: #16211b;
    --sunken: #0d1511;
    --border: #233029;
    --border-strong: #31423a;
    --text: #e6eee8;
    --text-dim: #98a79e;
    --text-faint: #6b7a71;
    --accent: #37b981;
    --accent-strong: #5fd6a0;
    --accent-soft: rgba(55, 185, 129, 0.14);
    --on-accent: #06120c;
    --info: #7aa7e6;
    --info-soft: rgba(122, 167, 230, 0.14);
    --violet: #b39ae8;
    --violet-soft: rgba(179, 154, 232, 0.14);
    --warn: #e3a45a;
    --warn-soft: rgba(227, 164, 90, 0.14);
    --err: #ee7462;
    --err-soft: rgba(238, 116, 98, 0.14);
    --mono-bg: #070d0a;
    --mono-text: #cfe3d7;
    --mono-dim: #6f8579;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a110e;
      --panel: #111a15;
      --panel-2: #16211b;
      --sunken: #0d1511;
      --border: #233029;
      --border-strong: #31423a;
      --text: #e6eee8;
      --text-dim: #98a79e;
      --text-faint: #6b7a71;
      --accent: #37b981;
      --accent-strong: #5fd6a0;
      --accent-soft: rgba(55, 185, 129, 0.14);
      --on-accent: #06120c;
      --info: #7aa7e6;
      --info-soft: rgba(122, 167, 230, 0.14);
      --violet: #b39ae8;
      --violet-soft: rgba(179, 154, 232, 0.14);
      --warn: #e3a45a;
      --warn-soft: rgba(227, 164, 90, 0.14);
      --err: #ee7462;
      --err-soft: rgba(238, 116, 98, 0.14);
      --mono-bg: #070d0a;
      --mono-text: #cfe3d7;
      --mono-dim: #6f8579;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: grid;
    grid-template-columns: 290px minmax(0, 1fr);
    min-height: 100vh;
  }

  input, textarea, select, button { font-family: var(--font); }
  code, pre, .mono, textarea.code, input.mono, select.mono, .key-list input, #baseUrl { font-family: var(--mono); }
  .hidden { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  ::selection { background: var(--accent-soft); }

  /* ---------- Sidebar ---------- */
  .sidebar {
    border-left: 1px solid var(--border);
    background: var(--panel);
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px 4px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--accent), var(--accent-strong));
    color: var(--on-accent); font-weight: 800; font-size: 17px;
    box-shadow: var(--shadow-sm);
  }
  .brand-title { font-size: 15px; font-weight: 700; direction: ltr; text-align: right; }
  .brand-sub { font-size: 12px; color: var(--text-dim); }

  .card {
    border: 1px solid var(--border);
    background: var(--panel-2);
    border-radius: var(--radius-sm);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card-label { font-size: 11px; color: var(--text-faint); letter-spacing: 0.4px; }

  .url-row { display: flex; gap: 6px; }
  .url-row input { flex: 1; min-width: 0; direction: ltr; text-align: left; font-size: 12.5px; }

  .conn-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-dim); }
  .conn-row b { color: var(--text); font-weight: 600; }
  .conn-detail {
    font-family: var(--mono); font-size: 11px; color: var(--text-faint);
    direction: ltr; text-align: left; word-break: break-all; line-height: 1.5; white-space: pre-line;
    padding-inline-start: 16px;
  }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); flex-shrink: 0; }
  .dot.ok { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .dot.bad { background: var(--err); box-shadow: 0 0 0 3px var(--err-soft); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
  .dot.pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .switch { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-dim); cursor: pointer; user-select: none; }
  .switch input { accent-color: var(--warn); cursor: pointer; margin: 0; }
  .card.demo-on { border-color: var(--warn); background: var(--warn-soft); }
  .card.demo-on .switch { color: var(--warn); }

  details.keys summary {
    list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--text-dim);
  }
  details.keys summary::-webkit-details-marker { display: none; }
  details.keys summary::before { content: "▸"; font-size: 10px; }
  details.keys[open] summary::before { content: "▾"; }
  details.keys summary:hover { color: var(--text); }
  .key-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .key-list label { font-size: 11px; color: var(--text-faint); display: block; margin-bottom: 3px; }
  .key-list input { direction: ltr; text-align: left; font-size: 11.5px; padding: 6px 8px; }

  nav.groups { display: flex; flex-direction: column; gap: 2px; }
  .group-label { font-size: 11px; color: var(--text-faint); letter-spacing: 0.5px; padding: 12px 8px 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 8px; border-radius: var(--radius-sm);
    border: 1px solid transparent; cursor: pointer; color: var(--text);
    text-decoration: none;
  }
  .nav-item:hover { background: var(--panel-2); }
  .nav-item.active { background: var(--accent-soft); border-color: var(--accent); }
  .nav-item.active .nav-name { color: var(--accent-strong); font-weight: 600; }
  .nav-text { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
  .nav-name { font-size: 13px; }
  .nav-path {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-faint);
    direction: ltr; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .method {
    font-family: var(--mono); font-size: 9.5px; font-weight: 700;
    min-width: 38px; text-align: center; padding: 2px 5px; border-radius: 5px; flex-shrink: 0;
  }
  .method.get { background: var(--accent-soft); color: var(--accent-strong); }
  .method.post { background: var(--warn-soft); color: var(--warn); }
  .method.page { background: var(--info-soft); color: var(--info); font-family: var(--font); font-size: 10.5px; }

  .seg { display: flex; gap: 4px; padding: 3px; background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .seg button {
    flex: 1; border: 0; background: transparent; color: var(--text-dim);
    padding: 6px 8px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12.5px;
  }
  .seg button:hover { color: var(--text); }
  .seg button.active { background: var(--panel); color: var(--accent-strong); box-shadow: var(--shadow-sm); font-weight: 600; }
  .sidebar .seg { margin-top: auto; }

  /* ---------- Main ---------- */
  main { padding: 28px 36px 64px; max-width: 1080px; width: 100%; }

  .page-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
  .eyebrow { font-size: 12px; color: var(--text-faint); }
  h1 { font-size: 23px; margin: 0; line-height: 1.35; text-wrap: balance; }
  .route-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .path-chip {
    font-family: var(--mono); font-size: 12px; direction: ltr;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px;
  }
  .page-desc { color: var(--text-dim); font-size: 13.5px; line-height: 1.75; max-width: 75ch; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .panel-head h2 { font-size: 14px; margin: 0; font-weight: 700; }
  .panel-head .spacer { flex: 1; }
  .step {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent-strong); font-size: 12px; font-weight: 700;
  }

  .grid { display: grid; gap: 14px; }
  .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > label { font-size: 12.5px; color: var(--text-dim); display: flex; justify-content: space-between; gap: 8px; }
  .field > label .opt { font-size: 11px; color: var(--text-faint); }
  .hint { font-size: 12.5px; color: var(--text-dim); line-height: 1.7; }

  input[type=text], input[type=number], textarea, select {
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13px;
    width: 100%;
  }
  textarea { resize: vertical; min-height: 70px; line-height: 1.6; }
  textarea.code { direction: ltr; text-align: left; font-size: 12px; min-height: 180px; }
  textarea.prose { font-size: 14px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer;
    font: inherit; font-size: 13px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-strong); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; padding: 9px 18px; }
  .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
  .btn:disabled { opacity: 0.55; cursor: progress; }
  .btn.danger:hover { border-color: var(--err); color: var(--err); }
  .btn.recording { border-color: var(--err); color: var(--err); background: var(--err-soft); }
  .btn.recording::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--err); animation: pulse 1s infinite; }

  .spinner {
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid currentColor; border-top-color: transparent; opacity: 0.8;
    animation: spin 0.7s linear infinite; display: none;
  }
  .btn.busy .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .actions .spacer { flex: 1; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: var(--panel-2); color: var(--text-dim); border: 1px solid transparent; white-space: nowrap;
  }
  .pill.mono { font-family: var(--mono); font-weight: 500; direction: ltr; }
  .pill.ok { background: var(--accent-soft); color: var(--accent-strong); }
  .pill.info { background: var(--info-soft); color: var(--info); }
  .pill.violet { background: var(--violet-soft); color: var(--violet); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.err { background: var(--err-soft); color: var(--err); }
  .pill.outline { background: transparent; border-color: var(--border); }

  .meta-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; min-height: 22px; }
  .meta-row:empty { display: none; }

  .empty { color: var(--text-faint); font-size: 13px; text-align: center; padding: 30px 12px; line-height: 1.8; }
  .error-box {
    border: 1px solid var(--err); background: var(--err-soft); color: var(--err);
    border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; line-height: 1.7; white-space: pre-wrap;
  }

  /* ---------- Code ---------- */
  .code-wrap { position: relative; }
  .code-wrap .copy { position: absolute; top: 8px; left: 8px; opacity: 0.85; }
  pre.json {
    background: var(--mono-bg); color: var(--mono-text);
    padding: 14px 16px; border-radius: var(--radius-sm);
    font-size: 12px; line-height: 1.6; overflow: auto; max-height: 460px;
    direction: ltr; text-align: left; margin: 0; white-space: pre;
  }
  .jk { color: #7fc7e0; }
  .js { color: #b9d98a; }
  .jn { color: #e0b45f; }
  .jb { color: #e08fa0; }

  details.fold { margin-top: 12px; }
  details.fold > summary {
    cursor: pointer; user-select: none; font-size: 12.5px; color: var(--text-dim);
    list-style: none; display: inline-flex; align-items: center; gap: 6px;
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "▸"; font-size: 10px; }
  details.fold[open] > summary::before { content: "▾"; }
  details.fold > summary:hover { color: var(--accent-strong); }
  details.fold > :not(summary) { margin-top: 8px; }

  /* ---------- Overview ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tile {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 4px; min-width: 0;
  }
  .tile-label { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .tile-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile-value.small { font-size: 15px; }
  .tile-sub { font-size: 11.5px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile.ok .tile-value { color: var(--accent-strong); }
  .tile.bad .tile-value { color: var(--err); }

  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; font-size: 13px; align-items: baseline; }
  .kv dt { color: var(--text-dim); }
  .kv dd { margin: 0; min-width: 0; word-break: break-word; }
  .kv dd.mono { font-size: 12px; direction: ltr; text-align: right; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .features { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .feature {
    display: flex; flex-direction: column; gap: 8px; text-align: right;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; cursor: pointer; color: var(--text); font: inherit; box-shadow: var(--shadow-sm);
  }
  .feature:hover { border-color: var(--accent); transform: translateY(-1px); }
  .feature h3 { margin: 0; font-size: 14px; }
  .feature p { margin: 0; font-size: 12.5px; color: var(--text-dim); line-height: 1.65; }
  .feature .foot { display: flex; align-items: center; gap: 6px; margin-top: auto; flex-wrap: wrap; }

  .callout {
    border: 1px dashed var(--border-strong); border-radius: var(--radius-sm);
    padding: 10px 12px; font-size: 12.5px; color: var(--text-dim); line-height: 1.8; margin-top: 12px;
  }
  .callout code { font-size: 11.5px; direction: ltr; unicode-bidi: embed; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }

  /* ---------- Chat ---------- */
  .chat-log {
    display: flex; flex-direction: column; gap: 10px;
    max-height: 560px; min-height: 180px; overflow-y: auto;
    padding: 4px 2px 8px;
  }
  .bubble {
    max-width: 82%; padding: 10px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
  }
  .bubble .who { font-size: 11px; color: var(--text-faint); margin-bottom: 3px; font-weight: 600; }
  .bubble.user { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); border-start-start-radius: 4px; }
  .bubble.assistant { align-self: flex-end; background: var(--accent-soft); border: 1px solid var(--accent); border-start-end-radius: 4px; }
  .bubble.tool { align-self: flex-start; background: var(--info-soft); border: 1px solid var(--info); font-size: 12.5px; max-width: 90%; }
  .bubble.tool pre.json { margin-top: 6px; max-height: 200px; font-size: 11px; }
  .bubble.system { align-self: center; background: transparent; border: 1px dashed var(--border-strong); font-size: 12px; color: var(--text-dim); max-width: 95%; }
  .bubble.error { align-self: stretch; max-width: none; background: var(--err-soft); border: 1px solid var(--err); color: var(--err); font-size: 13px; }
  .bubble audio { width: 100%; margin-top: 8px; display: block; }

  .tool-call {
    align-self: flex-end; max-width: 90%;
    border: 1px dashed var(--violet); background: var(--violet-soft);
    border-radius: 12px; padding: 8px 12px; font-size: 12.5px;
  }
  .tool-call .head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--violet); font-weight: 600; }
  .tool-call code { font-size: 12px; direction: ltr; }
  .tool-call .args { margin-top: 4px; font-family: var(--mono); font-size: 11.5px; direction: ltr; text-align: left; color: var(--text-dim); white-space: pre-wrap; word-break: break-all; }

  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
  .chip-btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text-dim);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 12.5px;
  }
  .chip-btn:hover { border-color: var(--accent); color: var(--accent-strong); }

  .composer { display: flex; gap: 10px; align-items: flex-end; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 6px; }
  .composer textarea { min-height: 46px; max-height: 180px; }

  .tool-results {
    border: 1px solid var(--violet); background: var(--violet-soft);
    border-radius: var(--radius-sm); padding: 12px; margin-top: 10px; display: flex; flex-direction: column; gap: 10px;
  }
  .tool-results h3 { margin: 0; font-size: 13px; color: var(--violet); }
  .tool-results .tr-item { display: flex; flex-direction: column; gap: 6px; }
  .tool-results textarea.code { min-height: 110px; background: var(--panel); }

  /* ---------- Files ---------- */
  .dropzone {
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    border: 1.5px dashed var(--border-strong); border-radius: var(--radius-sm);
    background: var(--panel-2); padding: 14px 16px; color: var(--text-dim);
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone.has-file { border-style: solid; border-color: var(--accent); }
  .dz-icon { font-size: 22px; color: var(--accent); }
  .dz-text { display: flex; flex-direction: column; gap: 2px; }
  .dz-text b { color: var(--text); font-size: 13px; font-weight: 600; }
  .dz-text small { font-size: 11.5px; }
  .dz-name { margin-inline-start: auto; font-size: 12px; font-family: var(--mono); direction: ltr; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dz-preview img { max-width: 100%; max-height: 260px; border-radius: var(--radius-sm); margin-top: 10px; border: 1px solid var(--border); display: block; }
  .dz-preview audio, audio.player { width: 100%; margin-top: 10px; display: block; }
  .audio-input { display: flex; flex-direction: column; gap: 10px; }
  .audio-input .rec-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .or-sep { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--text-faint); }
  .or-sep::before, .or-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  /* ---------- Order card ---------- */
  .order-card { border: 1px solid var(--accent); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
  .order-card .oc-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--accent-soft); padding: 12px 16px; color: var(--accent-strong); font-weight: 700;
  }
  .order-card .oc-head .spacer { flex: 1; }
  .order-card .oc-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
  .oc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .oc-section h4 { margin: 0 0 6px; font-size: 12px; color: var(--text-faint); font-weight: 600; }
  .oc-section .line { font-size: 13px; line-height: 1.8; }
  .oc-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--border); padding-top: 10px; font-weight: 700; }
  .oc-total .num { font-size: 17px; color: var(--accent-strong); }
  .oc-msg { font-size: 13px; color: var(--text-dim); line-height: 1.7; background: var(--panel-2); border-radius: var(--radius-sm); padding: 10px 12px; }

  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th {
    text-align: right; font-size: 11.5px; font-weight: 600; color: var(--text-faint);
    padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.data td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.data tr:last-child td { border-bottom: 0; }
  table.data .num { font-variant-numeric: tabular-nums; direction: ltr; text-align: left; white-space: nowrap; }
  .table-scroll { overflow-x: auto; }

  /* ---------- District ---------- */
  table.edit td { padding: 4px; border-bottom: 0; }
  table.edit input { padding: 6px 8px; font-size: 12.5px; }
  table.edit .seq { width: 64px; font-family: var(--mono); }
  table.edit .code-in { width: 96px; direction: ltr; text-align: left; font-family: var(--mono); }
  .conf { display: flex; align-items: center; gap: 6px; min-width: 90px; }
  .conf-track { flex: 1; height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
  .conf-fill { height: 100%; background: var(--accent); border-radius: 3px; }
  .conf span { font-size: 11px; font-family: var(--mono); color: var(--text-dim); }
  .arrow { color: var(--text-faint); padding: 0 4px; }
  .reason { font-size: 12px; color: var(--text-dim); margin-top: 3px; }

  /* ---------- Load test ---------- */
  .bars { display: flex; flex-direction: column; gap: 6px; }
  .bar-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 76px; align-items: center; gap: 10px; font-size: 12px; }
  .bar-row .idx { color: var(--text-faint); font-family: var(--mono); }
  .bar-track { height: 18px; background: var(--panel-2); border-radius: 5px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 5px; min-width: 2px; }
  .bar-fill.err { background: var(--err); }
  .bar-row .ms { font-family: var(--mono); direction: ltr; text-align: left; color: var(--text-dim); }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    body { display: block; }
    .sidebar { position: static; height: auto; border-left: 0; border-bottom: 1px solid var(--border); }
    nav.groups { flex-direction: row; flex-wrap: wrap; gap: 4px; }
    .group-label { width: 100%; padding: 8px 4px 2px; }
    .nav-item { border-color: var(--border); }
    .nav-path { display: none; }
    main { padding: 20px 16px 48px; }
    .grid.two, .grid.three, .oc-grid { grid-template-columns: 1fr; }
    .tiles.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .bubble, .tool-call { max-width: 94%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dot.pulse, .spinner, .btn.recording::before { animation: none; }
    .feature:hover { transform: none; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">ع</div>
    <div>
      <div class="brand-title">back_end_iraqi</div>
      <div class="brand-sub">لوحة اختبار API</div>
    </div>
  </div>

  <div class="card">
    <label class="card-label" for="baseUrl">رابط الخادم (Base URL)</label>
    <div class="url-row">
      <input id="baseUrl" type="text" value="http://localhost:8000" spellcheck="false" />
      <button id="pingBtn" class="btn small" type="button">فحص</button>
    </div>
    <div class="conn-row"><span class="dot" id="apiDot"></span><span>الخادم:</span><b id="apiText">لم يُفحص بعد</b></div>
    <div class="conn-row"><span class="dot" id="llmDot"></span><span>الموديل:</span><b id="llmText">—</b></div>
    <div class="conn-detail" id="llmDetail"></div>
  </div>

  <div class="card" id="demoCard">
    <label class="switch" title="بيانات تجريبية محلية بدل الاتصال الفعلي — جرّب الصفحة كاملة بلا خادم">
      <input type="checkbox" id="demoCheck" />
      <span>وضع تجريبي (بلا خادم)</span>
    </label>
  </div>

  <details class="card keys" id="keysBox">
    <summary>مفاتيح API — مفتاح مستقل لكل خدمة</summary>
    <div class="key-list" id="keyList"></div>
  </details>

  <nav class="groups" id="nav"></nav>

  <div class="seg" id="themeSeg">
    <button type="button" data-mode="auto">تلقائي</button>
    <button type="button" data-mode="light">فاتح</button>
    <button type="button" data-mode="dark">داكن</button>
  </div>
</aside>

<main id="main"></main>

<script>
(function () {
  "use strict";

  /* ================= أدوات عامة ================= */

  const $ = (id) => document.getElementById(id);

  function h(tag, props, ...children) {
    const node = document.createElement(tag);
    if (props) {
      for (const [key, value] of Object.entries(props)) {
        if (value == null || value === false) continue;
        if (key === "class") node.className = value;
        else if (key === "text") node.textContent = value;
        else if (key === "html") node.innerHTML = value;
        else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
        else if (key === "value" || key === "checked" || key === "disabled") node[key] = value;
        else node.setAttribute(key, value === true ? "" : value);
      }
    }
    for (const child of children.flat()) {
      if (child == null || child === false) continue;
      node.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  const store = {
    get(key) { try { return localStorage.getItem("iraqi_" + key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem("iraqi_" + key, value); } catch (e) {} }
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function highlightJson(value) {
    const text = typeof value === "string" ? value : JSON.stringify(value, null, 2);
    return escapeHtml(text === undefined ? "null" : text).replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,
      (m) => {
        let cls = "jn";
        if (/^"/.test(m)) cls = /:$/.test(m) ? "jk" : "js";
        else if (/true|false|null/.test(m)) cls = "jb";
        return '<span class="' + cls + '">' + m + "</span>";
      }
    );
  }

  function copyText(text, button) {
    const done = () => {
      if (!button) return;
      const old = button.textContent;
      button.textContent = "✓ انسخ";
      setTimeout(() => { button.textContent = old; }, 1400);
    };
    const fallback = () => {
      // clipboard API يحتاج سياقاً آمناً (https أو localhost)؛ عبر IP أو http نرجع للطريقة القديمة.
      const ta = h("textarea", { style: "position:fixed;opacity:0", value: text });
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      ta.remove();
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  function codeBlock(value, raw) {
    const text = raw ? String(value) : JSON.stringify(value, null, 2);
    const pre = h("pre", { class: "json" });
    if (raw) pre.textContent = text; else pre.innerHTML = highlightJson(value);
    const copy = h("button", { type: "button", class: "btn small copy", text: "نسخ" });
    copy.addEventListener("click", () => copyText(text, copy));
    return h("div", { class: "code-wrap" }, pre, copy);
  }

  function fold(title, content, open) {
    return h("details", { class: "fold", open: !!open }, h("summary", { text: title }), content);
  }

  function pill(text, tone) { return h("span", { class: "pill " + (tone || ""), text: text }); }

  function statusTone(code) {
    if (code >= 200 && code < 300) return "ok";
    if (code >= 400) return "err";
    return "";
  }
  function statusPill(code) { return pill(code ? "HTTP " + code : "فشل الاتصال", statusTone(code) || "err"); }
  function msPill(ms) { return pill(fmtMs(ms), "mono outline"); }
  function demoPill() { return isDemo() ? pill("تجريبي", "warn") : null; }

  function setMeta(el, ...nodes) { el.replaceChildren(...nodes.flat().filter(Boolean)); }

  // عزل LTR داخل نص عربي حتى ما تنقلب القيم المختلطة مثل "1841 ms" أو "6.6 / 44 GB".
  const ltr = (s) => "⁦" + s + "⁩";
  function fmtMs(ms) { return ms == null ? "—" : ltr(ms >= 10000 ? (ms / 1000).toFixed(1) + " s" : Math.round(ms) + " ms"); }
  function fmtSize(bytes) { return bytes > 1048576 ? (bytes / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(bytes / 1024)) + " KB"; }
  function fmtMoney(n, currency) {
    if (n == null) return "—";
    return Number(n).toLocaleString("en-US") + " " + (currency === "IQD" || !currency ? "دينار" : currency);
  }
  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" });
  }

  function decodeHeader(res, name) {
    try { return decodeURIComponent(res.headers.get(name) || ""); } catch (e) { return res.headers.get(name) || ""; }
  }

  function errorText(json, status) {
    if (!json) return "فشل الطلب (HTTP " + status + ")";
    const d = json.detail;
    if (typeof d === "string") return d;
    if (Array.isArray(d)) return d.map((e) => (e.loc ? e.loc.join(".") + ": " : "") + e.msg).join("\n");
    if (d) return JSON.stringify(d, null, 2);
    return JSON.stringify(json, null, 2);
  }

  function makeButton(text, cls) {
    const label = h("span", { text: text });
    const btn = h("button", { type: "button", class: "btn " + (cls || "primary") }, h("span", { class: "spinner" }), label);
    btn.setBusy = (busy) => { btn.disabled = busy; btn.classList.toggle("busy", busy); };
    btn.setLabel = (t) => { label.textContent = t; };
    return btn;
  }

  function panel(title, opts) {
    opts = opts || {};
    const head = h("div", { class: "panel-head" },
      opts.step ? h("span", { class: "step", text: opts.step }) : null,
      h("h2", { text: title }),
      h("span", { class: "spacer" }),
      opts.actions || null);
    const node = h("section", { class: "panel" + (opts.hidden ? " hidden" : "") }, head);
    return node;
  }

  function field(label, input, optional) {
    return h("div", { class: "field" },
      h("label", {}, h("span", { text: label }), optional ? h("span", { class: "opt", text: optional }) : null),
      input);
  }

  function emptyState(text) { return h("div", { class: "empty", text: text }); }
  function errorBox(text) { return h("div", { class: "error-box", text: text }); }

  function parseJsonInput(text, what) {
    try { return JSON.parse(text); }
    catch (e) { alert("JSON غير صالح في " + what + ":\n" + e.message); return undefined; }
  }

  /* ================= الثيم ================= */

  const root = document.documentElement;
  function setTheme(mode) {
    if (mode === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", mode);
    document.querySelectorAll("#themeSeg button").forEach((b) => b.classList.toggle("active", b.dataset.mode === mode));
    store.set("theme", mode);
  }
  document.querySelectorAll("#themeSeg button").forEach((b) => b.addEventListener("click", () => setTheme(b.dataset.mode)));
  setTheme(store.get("theme") || "auto");

  /* ================= رابط الخادم ================= */

  const baseUrlInput = $("baseUrl");
  baseUrlInput.value = store.get("base_url") ||
    (location.protocol.startsWith("http") ? location.origin : "http://localhost:8000");
  baseUrlInput.addEventListener("change", () => { store.set("base_url", baseUrlInput.value.trim()); pingServer(); });
  const baseUrl = () => baseUrlInput.value.trim().replace(/\/+$/, "");

  /* ================= مفاتيح API ================= */

  // القيم الافتراضية تطابق app/config.py؛ أي تعديل هنا ينحفظ بالمتصفح فقط.
  const KEY_SERVICES = [
    { id: "sales", label: "المبيعات", def: "sk-sales-b3f7b6a1c94d4e8fa2e6c1d9f0b7a4e2" },
    { id: "openai", label: "واجهة OpenAI (jbot)", def: "sk-openai-7a9c2e4f6b1d8a0c3e5f7b9d1a3c5e7f" },
    { id: "orders", label: "إنشاء الطلبات", def: "sk-orders-1d4f6a8c0e2b4d6f8a0c2e4b6d8f0a2c" },
    { id: "voiceFollowup", label: "المتابعة الصوتية", def: "sk-voicefu-4e6a8c0b2d4f6a8c0e2b4d6f8a0c2e4b" },
    { id: "district", label: "تصحيح المناطق", def: "sk-district-7ea5de0fb1b68f0283df460dea42b2df" }
  ];
  const keyInputs = {};
  KEY_SERVICES.forEach((svc) => {
    const input = h("input", { type: "text", id: "key_" + svc.id, spellcheck: "false", value: store.get("api_key_" + svc.id) || svc.def });
    input.addEventListener("change", () => store.set("api_key_" + svc.id, input.value.trim()));
    keyInputs[svc.id] = input;
    $("keyList").appendChild(h("div", {}, h("label", { for: "key_" + svc.id, text: svc.label }), input));
  });
  const keyLabel = (id) => (KEY_SERVICES.find((s) => s.id === id) || {}).label || id;
  const apiKey = (id) => (keyInputs[id] ? keyInputs[id].value.trim() : "");
  const keyHeader = (id) => (id && apiKey(id) ? { "X-API-Key": apiKey(id) } : {});

  /* ================= أمر curl المكافئ ================= */

  function curlCommand(opts) {
    const q = (s) => "'" + String(s).replace(/'/g, "'\\''") + "'";
    const lines = ["curl -X " + opts.method + " " + q(baseUrl() + opts.path)];
    if (opts.key && apiKey(opts.key)) lines.push("-H " + q("X-API-Key: " + apiKey(opts.key)));
    if (opts.json !== undefined) {
      lines.push("-H 'Content-Type: application/json'");
      lines.push("-d " + q(JSON.stringify(opts.json)));
    }
    (opts.form || []).forEach((f) => lines.push("-F " + q(f.name + "=" + (f.file ? "@" + f.value : f.value))));
    if (opts.output) lines.push("-o " + opts.output);
    return lines.join(" \\\n  ");
  }
  function curlFold(opts) { return fold("أمر curl المكافئ", codeBlock(curlCommand(opts), true)); }

  /* ================= الوضع التجريبي ================= */

  const demoCheck = $("demoCheck");
  demoCheck.checked = store.get("demo_mode") === "1";
  const isDemo = () => demoCheck.checked;
  function syncDemoCard() { $("demoCard").classList.toggle("demo-on", isDemo()); }
  demoCheck.addEventListener("change", () => {
    store.set("demo_mode", isDemo() ? "1" : "0");
    syncDemoCard();
    pingServer();
    selectEndpoint(currentId);
  });
  syncDemoCard();

  const DEMO_PRODUCTS = [
    { id: "P-1001", name: "لابتوب لينوفو IdeaPad 15", category: "لابتوبات", price: 750000, currency: "IQD", in_stock: true, stock_quantity: 14,
      description: "معالج Core i5، رام 8 جيجا، SSD 512 جيجا، شاشة 15.6 انج." },
    { id: "P-1002", name: "لابتوب Asus VivoBook 14", category: "لابتوبات", price: 980000, currency: "IQD", in_stock: true, stock_quantity: 5,
      description: "معالج Core i7، رام 16 جيجا، SSD 1 تيرا، كارت شاشة منفصل." },
    { id: "P-2001", name: "مكيف سبلت LG انفرتر 1.5 طن", category: "مكيفات", price: 620000, currency: "IQD", in_stock: true, stock_quantity: 9,
      description: "بارد فقط، توفير طاقة انفرتر، تبريد سريع." },
    { id: "P-2002", name: "مكيف سبلت سامسونك 2 طن", category: "مكيفات", price: 890000, currency: "IQD", in_stock: false, stock_quantity: 0,
      description: "بارد وحار، فلتر تنقية هواء." },
    { id: "P-3001", name: "ماوس لوجيتك لاسلكي", category: "ملحقات", price: 15000, currency: "IQD", in_stock: true, stock_quantity: 40,
      description: "لاسلكي 2.4G، بطارية تدوم سنة." },
    { id: "P-4001", name: "غسالة اتوماتيك سامسونك 8 كغم", category: "غسالات", price: 540000, currency: "IQD", in_stock: true, stock_quantity: 3,
      description: "تحميل امامي، برامج غسيل متعددة." }
  ];
  const DEMO_KEYWORDS = { "لابتوب": "لابتوبات", "مكيف": "مكيفات", "غسال": "غسالات", "ماوس": "ملحقات" };

  function demoQueryFor(text) {
    const hit = Object.keys(DEMO_KEYWORDS).find((k) => (text || "").indexOf(k) !== -1);
    return hit || (text || "").trim();
  }
  function demoSearch(query, category, inStockOnly) {
    const q = (query || "").trim();
    return DEMO_PRODUCTS.filter((p) => {
      if (category && p.category !== category) return false;
      if (inStockOnly && !p.in_stock) return false;
      if (!q) return true;
      const hay = p.name + " " + p.category + " " + p.description;
      return q.split(/\s+/).some((w) => w && hay.indexOf(w) !== -1);
    });
  }
  function demoAnswerFromProducts(products) {
    if (!products || !products.length) {
      return "عذراً عيني، ماكو منتج مطابق هسه. تحب أشوفلك بديل؟ [بيانات تجريبية]";
    }
    const p = products[0];
    const alt = products.slice(1, 3).map((a) => "- " + a.name + " — " + fmtMoney(a.price, a.currency));
    return "هلا بيك، عدنا " + p.name + " بسعر " + fmtMoney(p.price, p.currency) +
      " (" + (p.in_stock ? "متوفر بالمخزون" : "غير متوفر حالياً") + ").\n- " + p.description +
      (alt.length ? "\n\nبدائل متوفرة:\n" + alt.join("\n") : "") +
      "\n\nتحب أحجزلك وحدة؟ [بيانات تجريبية]";
  }
  function demoToolResult(call) {
    let args = {};
    try { args = JSON.parse(call.function.arguments || "{}"); } catch (e) {}
    switch (call.function.name) {
      case "search_products": {
        const results = demoSearch(args.query, args.category, args.in_stock_only);
        return { found: results.length > 0, count: results.length, results: results.slice(0, 5) };
      }
      case "get_product_details":
        return DEMO_PRODUCTS.find((p) => p.id === args.product_id) || { error: "PRODUCT_NOT_FOUND" };
      case "get_categories":
        return { categories: Array.from(new Set(DEMO_PRODUCTS.map((p) => p.category))) };
      case "get_customer_orders":
        return { orders: [{ order_id: "ORD-1042", status: "قيد التوصيل", total: 765000, currency: "IQD" }] };
      case "get_order_details":
        return { order_id: args.order_id || "ORD-1042", status: "قيد التوصيل", items: [{ product_name: "لابتوب لينوفو IdeaPad 15", quantity: 1 }] };
      case "create_order":
        return { success: true, order_id: "ORD-" + Math.floor(1000 + Math.random() * 9000) };
      default:
        return {};
    }
  }
  function contentText(content) {
    if (typeof content === "string") return content;
    if (Array.isArray(content)) return content.filter((c) => c && c.type === "text").map((c) => c.text).join("\n");
    return "";
  }

  function demoChatMessage(body) {
    const msgs = body.messages || [];
    const last = msgs[msgs.length - 1] || {};
    const toolNames = (body.tools || []).map((t) => t.function && t.function.name);
    if (last.role === "user" && body.tool_choice !== "none" && toolNames.indexOf("search_products") !== -1) {
      const query = demoQueryFor(contentText(last.content));
      if (demoSearch(query).length) {
        return { role: "assistant", content: null, tool_calls: [{
          id: "call_demo_" + Date.now().toString(36), type: "function",
          function: { name: "search_products", arguments: JSON.stringify({ query: query }) }
        }] };
      }
    }
    if (last.role === "tool") {
      let result = null;
      try { result = JSON.parse(last.content); } catch (e) {}
      if (result && Array.isArray(result.results)) return { role: "assistant", content: demoAnswerFromProducts(result.results) };
      if (result && result.success) return { role: "assistant", content: "تم تثبيت طلبك برقم " + result.order_id + " — شكراً إلك. [بيانات تجريبية]" };
      return { role: "assistant", content: "تمام، وصلتني النتيجة. شتحب نسوي بعد؟ [بيانات تجريبية]" };
    }
    const userText = contentText(last.content);
    return { role: "assistant", content: demoAnswerFromProducts(demoSearch(demoQueryFor(userText))) };
  }

  function sseFromCompletion(completion) {
    const base = { id: completion.id, object: "chat.completion.chunk", created: completion.created, model: completion.model };
    const choice = completion.choices[0];
    const delta = Object.assign({}, choice.message);
    if (delta.tool_calls) delta.tool_calls = delta.tool_calls.map((c, i) => Object.assign({ index: i }, c));
    return "data: " + JSON.stringify(Object.assign({}, base, { choices: [{ index: 0, delta: delta, finish_reason: null }] })) + "\n\n" +
      "data: " + JSON.stringify(Object.assign({}, base, { choices: [{ index: 0, delta: {}, finish_reason: choice.finish_reason }] })) + "\n\n" +
      "data: [DONE]\n\n";
  }

  function arabicKey(s) {
    return String(s || "").replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا")
      .replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/\s+/g, " ").trim();
  }
  function demoCorrectCase(c) {
    const list = DEMO_DISTRICTS[c.stateCode] || [];
    const raw = (c.district || "").trim();
    const key = arabicKey(raw);
    const bare = (s) => arabicKey(s).replace(/^ال/, "");
    const out = { excelSequence: c.excelSequence, originalDistrict: c.district || "", correctDistrict: "", addressDetails: c.address || "",
      confidence: 0, status: "UNRESOLVED", reason: "", stateCode: c.stateCode, errorCode: null };
    let m;
    if ((m = list.find((d) => d === raw))) return Object.assign(out, { correctDistrict: m, confidence: 1, status: "EXACT_MATCH", reason: "مطابقة حرفية مع الكتالوج." });
    if ((m = list.find((d) => bare(d) === bare(raw)))) return Object.assign(out, { correctDistrict: m, confidence: 0.97, status: "NORMALIZED_MATCH", reason: "مطابقة بعد توحيد الهمزات والتاء المربوطة وأل التعريف." });
    if ((m = list.find((d) => key.indexOf(bare(d)) !== -1))) {
      const rest = raw.replace(new RegExp("^.*?" + bare(m).split("").join("\\s*")), "").replace(/^[\s،,-]+/, "");
      return Object.assign(out, { correctDistrict: m, confidence: 0.9, status: "SPLIT_ADDRESS",
        addressDetails: [rest, c.address].filter(Boolean).join("، "), reason: "المنطقة مدموجة مع تفاصيل العنوان فانفصلت." });
    }
    if (bare(raw).length >= 3 && (m = list.find((d) => bare(d).slice(0, 3) === bare(raw).slice(0, 3)))) {
      return Object.assign(out, { correctDistrict: m, confidence: 0.78, status: "FUZZY_MATCH", reason: "أقرب اسم مشابه بالكتالوج." });
    }
    return Object.assign(out, { reason: "ماكو مرشح مناسب ضمن مناطق المحافظة.", errorCode: list.length ? "NO_CANDIDATE" : "UNKNOWN_STATE" });
  }

  function toneWav(seconds, freq) {
    const rate = 16000, n = Math.floor(rate * seconds);
    const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, "data"); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) {
      const env = Math.min(1, i / 800, (n - i) / 800);
      v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * freq * (i / rate)) * env * 5000, true);
    }
    return new Blob([buf], { type: "audio/wav" });
  }
  function audioResponse(headers, freq) {
    const enc = {};
    Object.keys(headers).forEach((k) => { enc[k] = /[^\x20-\x7e]/.test(headers[k]) ? encodeURIComponent(headers[k]) : headers[k]; });
    return new Response(toneWav(0.7, freq || 660), { status: 200, headers: Object.assign({ "Content-Type": "audio/wav" }, enc) });
  }

      case "/voice_followup/respond":
        return audioResponse({ "X-Reason-Summary": "الزبون ألغى الطلب لأن التوصيل تأخر يومين عن الموعد.",
          "X-Customer-Transcript": "والله تأخر عليّ التوصيل يومين فلغيته", "X-Query-Sent": "true" }, 740);
      case "/voice_followup/postpone/start": {
        const sid = "demo-call-" + Date.now().toString(36);
        demoPostponeTurns[sid] = 0;
        return audioResponse({ "X-Session-Id": sid, "X-Call-Status": "continue",
          "X-Reply-Text": "هلا بيك، ويّاك صباح. طلبك الغسالة جاهز للتسليم اليوم — يناسبك نوصلّه هسه لو تحب نأجّله؟" }, 620);

  async function getJson(path) {
    const t0 = performance.now();
    try {
      const res = await api(path);
      const data = await res.json().catch(() => null);
      return { ok: res.ok, status: res.status, data: data, ms: performance.now() - t0 };
    } catch (e) {
      return { ok: false, status: 0, data: null, error: e.message, ms: performance.now() - t0 };
    }
  }

  function parseSse(raw) {
    let message = null, finish = null, usage = null;
    raw.split(/\r?\n/).forEach((line) => {
      if (line.indexOf("data: ") !== 0 || line === "data: [DONE]") return;
      let evt;
      try { evt = JSON.parse(line.slice(6)); } catch (e) { return; }
      const choice = evt.choices && evt.choices[0];
      if (!choice) return;
      const d = choice.delta || {};
      if (!message) message = { role: "assistant", content: null };
      if (typeof d.content === "string") message.content = (message.content || "") + d.content;
      if (Array.isArray(d.tool_calls)) {
        message.tool_calls = (message.tool_calls || []).concat(d.tool_calls.map((c) => { const x = Object.assign({}, c); delete x.index; return x; }));
      }
      if (choice.finish_reason) finish = choice.finish_reason;
      if (evt.usage) usage = evt.usage;
    });
    return { message: message, finish: finish, usage: usage };
  }

          h("label", {}, h("span", { text: "البث" })), h("span", { class: "hint", text: "هذي النقطة ترجع JSON فقط." }))),

    /* --- المحادثة --- */

    function renderLog() {
      log.replaceChildren();
      if (!messages.length) {
        log.appendChild(h("div", { class: "empty" }, "ابدأ المحادثة كعميل يسأل عن منتج.",
          h("div", { class: "suggestions" }, CHAT_SUGGESTIONS.map((s) =>
            h("button", { type: "button", class: "chip-btn", text: s, onclick: () => { input.value = s; input.focus(); } })))));
      }
      messages.forEach((msg) => {
        if (msg.role === "user") {
          log.appendChild(h("div", { class: "bubble user" }, h("div", { class: "who", text: "العميل" }), contentText(msg.content)));
        } else if (msg.role === "system") {
          log.appendChild(h("div", { class: "bubble system" }, h("div", { class: "who", text: "system" }), contentText(msg.content)));
        } else if (msg.role === "tool") {
          const call = findCall(msg.tool_call_id);
          let parsed = msg.content;
          try { parsed = JSON.parse(msg.content); } catch (e) {}
          log.appendChild(h("div", { class: "bubble tool" },
            h("div", { class: "who", text: "نتيجة " + (call ? call.function.name : "أداة") }),
            fold("عرض النتيجة", codeBlock(parsed, typeof parsed === "string"))));
        } else if (msg.role === "assistant") {
          if (msg.content) log.appendChild(h("div", { class: "bubble assistant" }, h("div", { class: "who", text: "الوكيل" }), contentText(msg.content)));
          (msg.tool_calls || []).forEach((call) => {
            let args = call.function.arguments;
            try { args = JSON.stringify(JSON.parse(args), null, 1).replace(/\n\s*/g, " "); } catch (e) {}
            log.appendChild(h("div", { class: "tool-call" },
              h("div", { class: "head" }, "🔧 الموديل طلب تنفيذ ", h("code", { text: call.function.name })),
              h("div", { class: "args", text: args })));
          });
        }
      });
      log.scrollTop = log.scrollHeight;
      if (document.activeElement !== historyEditor) historyEditor.value = JSON.stringify(messages, null, 2);
    }

    function findCall(id) {
      for (const m of messages) for (const c of (m.tool_calls || [])) if (c.id === id) return c;
      return null;
    }

    function renderPending() {
      toolArea.replaceChildren();
      toolArea.classList.toggle("hidden", !pending.length);
      input.disabled = pending.length > 0;
      input.placeholder = pending.length ? "أرسل نتائج الأدوات أولاً ليكمل الموديل ردّه." : "اكتب رسالة العميل… (Enter للإرسال، Shift+Enter لسطر جديد)";
      if (!pending.length) return;
      const editors = pending.map((call) => {
        const ta = h("textarea", { class: "code", spellcheck: "false", value: JSON.stringify(demoToolResult(call), null, 2) });
        toolArea.appendChild(h("div", { class: "tr-item" },
          h("div", { class: "hint" }, "نتيجة ", h("code", { text: call.function.name }), " — ", h("span", { class: "mono", text: call.id })),
          ta));
        return { call: call, ta: ta };
      });
      toolArea.prepend(h("h3", { text: "الموديل ينتظر نتائج " + pending.length + " أداة — نتيجة تجريبية مقترحة، عدّلها كما يرجعها نظامك" }));
      const submit = makeButton("أرسل نتائج الأدوات وكمّل");
      submit.addEventListener("click", () => {
        for (const e of editors) {
          if (parseJsonInput(e.ta.value, "نتيجة " + e.call.function.name) === undefined) return;
        }
        editors.forEach((e) => messages.push({ role: "tool", tool_call_id: e.call.id, content: e.ta.value.trim() }));
        pending = [];
        renderPending();
        send();
      });
      toolArea.appendChild(h("div", {}, submit));
    }

    async function send() {
      const tools = parseJsonInput(toolsEditor.value, "tools");
      if (tools === undefined) return;
      const body = { model: modelInput.value.trim() || ep.defaultModel, messages: messages, tools: tools, tool_choice: toolChoice.value };
      if (isSales && maxTokens.value) body.max_tokens = parseInt(maxTokens.value, 10);
      if (forceStream || streamCheck.checked) body.stream = true;
      lastRequest = JSON.parse(JSON.stringify(body));

      sendBtn.setBusy(true);
      setMeta(meta, pill("جاري التوليد…", "info"));
      const t0 = performance.now();
      try {
        const res = await api(ep.path, {
          method: "POST",
          headers: Object.assign({ "Content-Type": "application/json" }, keyHeader(ep.key)),
          body: JSON.stringify(body)
        });
        const ms = performance.now() - t0;
        const raw = await res.text();
        const isSse = (res.headers.get("content-type") || "").indexOf("text/event-stream") !== -1;
        let message = null, finish = null, usage = null, parsed = null;
        if (res.ok && isSse) {
          ({ message, finish, usage } = parseSse(raw));
        } else {
          try { parsed = JSON.parse(raw); } catch (e) {}
          if (res.ok && parsed && parsed.choices) {
            message = parsed.choices[0].message;
            finish = parsed.choices[0].finish_reason;
            usage = parsed.usage;
          }
        }
        setMeta(meta, statusPill(res.status), msPill(ms),
          finish ? pill("finish: " + finish, finish === "tool_calls" ? "violet" : "outline") : null,
          usage && usage.total_tokens ? pill(usage.prompt_tokens + " → " + usage.completion_tokens + " توكن", "outline") : null,
          isSse ? pill("SSE", "info") : null, demoPill());

        if (!res.ok || !message) {
          log.appendChild(h("div", { class: "bubble error", text: errorText(parsed, res.status) }));
          log.scrollTop = log.scrollHeight;
        } else {
          const clean = { role: "assistant", content: message.content == null ? null : message.content };
          if (message.tool_calls && message.tool_calls.length) clean.tool_calls = message.tool_calls;
          messages.push(clean);
          pending = clean.tool_calls ? clean.tool_calls.slice() : [];
          renderLog();
          renderPending();
        }
        rawBox.replaceChildren(
          fold("الطلب المرسَل (JSON)", codeBlock(lastRequest)),
          fold("الرد الخام", codeBlock(isSse ? raw : (parsed || raw), isSse || !parsed)));
        curlBox.replaceChildren(curlFold({ method: "POST", path: ep.path, key: ep.key, json: lastRequest }));
      } catch (e) {
        setMeta(meta, statusPill(0));
        log.appendChild(h("div", { class: "bubble error", text: "تعذّر الوصول للخادم: " + e.message }));
      }
      sendBtn.setBusy(false);
    }

    function sendUserMessage() {
      const text = input.value.trim();
      if (!text || pending.length || sendBtn.disabled) return;
      messages.push({ role: "user", content: text });
      input.value = "";
      renderLog();
      send();
    }

    sendBtn.addEventListener("click", sendUserMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendUserMessage(); }
    });
    resetBtn.addEventListener("click", () => {
      messages = []; pending = [];
      setMeta(meta); rawBox.replaceChildren(); curlBox.replaceChildren();
      renderLog(); renderPending(); input.focus();
    });
    applyHistory.addEventListener("click", () => {
      const parsed = parseJsonInput(historyEditor.value, "سجل الرسائل");
      if (parsed === undefined) return;
      if (!Array.isArray(parsed)) { alert("سجل الرسائل لازم يكون مصفوفة."); return; }
      messages = parsed;
      const last = messages[messages.length - 1];
      pending = last && last.role === "assistant" && last.tool_calls ? last.tool_calls.slice() : [];
      renderLog(); renderPending();
    });

    renderLog();
    renderPending();
  }

  /* ================= مدخلات الملفات والصوت ================= */

  function makeDropzone(accept, title, onChange) {
    const input = h("input", { type: "file", accept: accept, class: "sr-only" });
    const name = h("span", { class: "dz-name", text: "" });
    const preview = h("div", { class: "dz-preview" });
    const zone = h("label", { class: "dropzone" }, input,
      h("span", { class: "dz-icon", text: "⇪" }),
      h("span", { class: "dz-text" }, h("b", { text: title }), h("small", { text: "اسحب الملف هنا أو اضغط للاختيار" })),
      name);
    function show() {
      const f = input.files[0] || null;
      name.textContent = f ? f.name + " · " + fmtSize(f.size) : "";
      zone.classList.toggle("has-file", !!f);
      preview.replaceChildren();
      if (f && f.type.indexOf("image/") === 0) preview.appendChild(h("img", { src: URL.createObjectURL(f), alt: "معاينة الصورة" }));
      else if (f && f.type.indexOf("audio/") === 0) preview.appendChild(h("audio", { controls: true, src: URL.createObjectURL(f) }));
      if (onChange) onChange(f);
    }
    input.addEventListener("change", show);
    ["dragenter", "dragover"].forEach((t) => zone.addEventListener(t, (e) => { e.preventDefault(); zone.classList.add("drag"); }));

  function makeAudioInput() {
    let recorded = null, recorder = null, chunks = [];
    const recBtn = h("button", { type: "button", class: "btn", text: "🎙 سجّل من المايكروفون" });
    const status = h("span", { class: "hint" });
    const recPreview = h("audio", { controls: true, class: "player hidden" });
    const dz = makeDropzone("audio/*", "ملف صوتي (wav / mp3 / m4a / webm)", (f) => {
      if (f) { recorded = null; recPreview.classList.add("hidden"); status.textContent = ""; }
    });
    recBtn.addEventListener("click", async () => {
      if (recorder && recorder.state === "recording") { recorder.stop(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        recorder = new MediaRecorder(stream);
        recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
        recorder.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          recorded = new File(chunks, "reply.webm", { type: recorder.mimeType || "audio/webm" });
          dz.reset();
          recPreview.src = URL.createObjectURL(recorded);
          recPreview.classList.remove("hidden");
          recBtn.classList.remove("recording");
          recBtn.textContent = "🎙 أعد التسجيل";
          status.textContent = "تسجيل جاهز · " + fmtSize(recorded.size);
        };
        recorder.start();
        recBtn.classList.add("recording");
        recBtn.textContent = "إيقاف التسجيل";
        status.textContent = "جاري التسجيل…";
      } catch (e) {
        status.textContent = "تعذّر الوصول للمايكروفون (يحتاج https أو localhost): " + e.message;
      }
    });
    return {
      node: h("div", { class: "audio-input" }, h("div", { class: "rec-row" }, recBtn, status), recPreview,
        h("div", { class: "or-sep", text: "أو" }), dz.node),
      getFile: () => dz.getFile() || recorded,
      reset() {
        recorded = null; dz.reset(); recPreview.classList.add("hidden");
        recBtn.textContent = "🎙 سجّل من المايكروفون"; status.textContent = "";
      }
    };
  }

      }
      askBtn.setBusy(false);
    });

    respondBtn.addEventListener("click", async () => {
      if (!sessionId) { alert("أرسل /ask أولاً — الجلسة تُستهلك بعد رد واحد."); return; }
      const file = audio.getFile();
      if (!file) { alert("سجّل صوتاً أو اختر ملفاً أولاً."); return; }
      respondBtn.setBusy(true);
      setMeta(respondMeta, pill("صوت ← نص ← تلخيص السبب ← صوت شكر…", "info"));
      respondBody.replaceChildren();
      const form = new FormData();
      form.append("audio", file, file.name || "reply.webm");
      const path = "/voice_followup/respond?session_id=" + encodeURIComponent(sessionId);
      const t0 = performance.now();
      try {
        const res = await api(path, { method: "POST", headers: keyHeader(ep.key), body: form });
        const ms = performance.now() - t0;
        if (!res.ok) {
          const err = await res.json().catch(() => null);
          setMeta(respondMeta, statusPill(res.status), msPill(ms));
          respondBody.replaceChildren(errorBox(errorText(err, res.status)));
        } else {
          const sent = res.headers.get("X-Query-Sent") === "true";
          const url = URL.createObjectURL(await res.blob());
          setMeta(respondMeta, statusPill(res.status), msPill(ms), demoPill(),
            pill(sent ? "انرسل لباك اند السستم" : "تعذّر الإرسال لباك اند السستم", sent ? "ok" : "warn"));
          respondBody.replaceChildren(h("div", { class: "chat-log", style: "min-height:0" },
            h("div", { class: "bubble user" }, h("div", { class: "who", text: "رد الزبون (Whisper)" }), decodeHeader(res, "X-Customer-Transcript") || "—"),
            h("div", { class: "bubble assistant" }, h("div", { class: "who", text: "ملخّص السبب" }), decodeHeader(res, "X-Reason-Summary") || "—", audioPlayer(url, true))),
            curlFold({ method: "POST", path: path, key: ep.key, form: [{ name: "audio", value: file.name || "reply.webm", file: true }], output: "thanks.wav" }));
          sessionId = null;
          sessionPill.classList.add("hidden");
        }
      } catch (e) {
        setMeta(respondMeta, statusPill(0));
        respondBody.replaceChildren(errorBox("تعذّر الوصول للخادم: " + e.message));
      }
      respondBtn.setBusy(false);
    });
  }

  /* ================= مكالمة التأجيل ================= */

  function renderVoicePostpone(container, ep) {
    let sessionId = null;
    let turn = 0;
    const orderInput = h("textarea", { class: "code", value: JSON.stringify({
      order_id: "ORD-1042", status: "قيد التوصيل", customer_name: "أحمد كاظم",
      items: [{ product_name: "غسالة اتوماتيك", quantity: 1 }],
      scheduled_date: new Date().toISOString().slice(0, 10)
    }, null, 2) });
    const startBtn = makeButton("ابدأ المكالمة");
    const sessionPill = pill("", "mono outline hidden");
    const startPanel = panel("بيانات الشحنة", { step: "١" });
    startPanel.append(field("JSON الشحنة — scheduled_date هو الموعد الحالي (YYYY-MM-DD)", orderInput),
      h("div", { class: "actions" }, startBtn, sessionPill));

    const callPanel = panel("مجرى المكالمة");
    const callMeta = h("div", { class: "meta-row" });
    const callLog = h("div", { class: "chat-log" }, emptyState("ابدأ المكالمة لتسمع افتتاح صباح."));
    callPanel.append(callMeta, callLog);

    const audio = makeAudioInput();
    const turnBtn = makeButton("أرسل رد الزبون");
    const turnPanel = panel("رد الزبون — يتكرر كل دور", { step: "٢", hidden: true });
    turnPanel.append(audio.node, h("div", { class: "actions" }, turnBtn));
    container.append(startPanel, callPanel, turnPanel);

    function add(cls, who, text, url) {
      const b = h("div", { class: "bubble " + cls }, h("div", { class: "who", text: who }), text || "—", url ? audioPlayer(url, true) : null);
      callLog.appendChild(b);
      b.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    const optionLabel = { today: "اليوم", tomorrow: "باجر", day_after: "بعد باجر" };

    startBtn.addEventListener("click", async () => {
      const order = parseJsonInput(orderInput.value, "بيانات الشحنة");
      if (order === undefined) return;
      startBtn.setBusy(true);
      turn = 0;
      setMeta(callMeta, pill("جاري توليد الافتتاح…", "info"));
      callLog.replaceChildren();
      const t0 = performance.now();
      try {
        const res = await api("/voice_followup/postpone/start", {
          method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, keyHeader(ep.key)), body: JSON.stringify(order)
        });
        const ms = performance.now() - t0;
        if (!res.ok) {
          const err = await res.json().catch(() => null);
          setMeta(callMeta, statusPill(res.status), msPill(ms));
          callLog.replaceChildren(errorBox(errorText(err, res.status)));
        } else {
          sessionId = res.headers.get("X-Session-Id");
          const url = URL.createObjectURL(await res.blob());
          setMeta(callMeta, statusPill(res.status), msPill(ms), pill("المكالمة جارية", "info"), demoPill());
          sessionPill.textContent = "session: " + (sessionId || "—");
          sessionPill.classList.remove("hidden");
          add("assistant", "صباح — الافتتاح", decodeHeader(res, "X-Reply-Text"), url);
          turnPanel.classList.remove("hidden");
          audio.reset();
        }
      } catch (e) {
        setMeta(callMeta, statusPill(0));
        callLog.replaceChildren(errorBox("تعذّر الوصول للخادم: " + e.message));
      }
      startBtn.setBusy(false);
    });

    turnBtn.addEventListener("click", async () => {
      if (!sessionId) { alert("ابدأ المكالمة أولاً."); return; }
      const file = audio.getFile();
      if (!file) { alert("سجّل صوتاً أو اختر ملفاً أولاً."); return; }
      turnBtn.setBusy(true);
      turn += 1;
      const form = new FormData();
      form.append("audio", file, file.name || "reply.webm");
      const t0 = performance.now();
      try {
        const res = await api("/voice_followup/postpone/respond?session_id=" + encodeURIComponent(sessionId),
          { method: "POST", headers: keyHeader(ep.key), body: form });
        const ms = performance.now() - t0;
        if (!res.ok) {
          const err = await res.json().catch(() => null);
          setMeta(callMeta, statusPill(res.status), msPill(ms));
          add("error", "خطأ بالدور " + turn, errorText(err, res.status));
        } else {
          const status = res.headers.get("X-Call-Status") || "";
          const chosen = res.headers.get("X-Chosen-Option") || "";
          const saved = res.headers.get("X-Postpone-Saved") || "";
          const url = URL.createObjectURL(await res.blob());
          const chosenText = chosen ? (optionLabel[chosen] || chosen) : "";
          setMeta(callMeta, statusPill(res.status), msPill(ms), demoPill(),
            pill(status === "ended" ? "انتهت المكالمة" : "المكالمة جارية", status === "ended" ? "outline" : "info"),
            chosenText ? pill("الموعد: " + chosenText, "violet") : null,
            saved ? pill(saved === "true" ? "انحفظ بنظام الطلبات" : "تعذّر الحفظ", saved === "true" ? "ok" : "warn") : null);
          add("user", "الزبون — دور " + turn + " (Whisper)", decodeHeader(res, "X-Customer-Transcript") || "(سكوت أو كلام غير مفهوم)");
          add("assistant", "صباح — دور " + turn, decodeHeader(res, "X-Reply-Text"), url);
          audio.reset();
          if (status === "ended") {
            sessionId = null;
            sessionPill.classList.add("hidden");
            turnPanel.classList.add("hidden");
            add("system", "انتهت المكالمة", chosenText
              ? "الموعد المثبَّت: " + chosenText + (saved === "true" ? " — انحفظ بنظام الطلبات." : saved === "false" ? " — تعذّر حفظه." : "")
              : "انتهت بلا تثبيت موعد.");
          }
        }
      } catch (e) {
        setMeta(callMeta, statusPill(0));
        add("error", "خطأ", "تعذّر الوصول للخادم: " + e.message);
      }
      turnBtn.setBusy(false);
    });
  }

  /* ================= اختبار الحمل ================= */

  function renderLoadTest(container, ep) {
    const msg = h("input", { type: "text", class: "prose", value: "هلو، شنو عندكم لابتوبات؟" });
    const count = h("input", { type: "number", min: "1", max: "64", value: "5" });
    const btn = makeButton("أطلق الطلبات");
    const cfg = panel("إعداد الاختبار");
    cfg.append(h("div", { class: "grid two" }, field("رسالة الاختبار", msg), field("عدد الطلبات المتزامنة (1–64)", count)),
      h("div", { class: "hint", style: "margin-top:10px", text: "كل طلب بلا أدوات (tools: []) حتى يرجع رداً نصياً مباشرة." }),
      h("div", { class: "actions" }, btn));

    const res = panel("النتائج");
    const tiles = h("div", { class: "tiles hidden" });
    const bars = h("div", {}, emptyState("كل الطلبات تنطلق بنفس اللحظة — والنتيجة تبيّن هل الخادم يعالجها بالتوازي أو بالتتابع."));
    res.append(tiles, bars);
    container.append(cfg, res);

    btn.addEventListener("click", async () => {
      const n = Math.max(1, Math.min(64, parseInt(count.value, 10) || 1));
      btn.setBusy(true);
      tiles.classList.add("hidden");
      bars.replaceChildren(emptyState("جاري إرسال " + n + " طلب متزامن…"));
      const t0 = performance.now();
      const results = await Promise.all(Array.from({ length: n }, async (_, i) => {
        const start = performance.now();
        try {
          const r = await api(ep.path.split(" ")[0], {
            method: "POST",
            headers: Object.assign({ "Content-Type": "application/json" }, keyHeader(ep.key)),
            body: JSON.stringify({ model: "sales", tools: [], messages: [{ role: "user", content: msg.value + " (#" + (i + 1) + ")" }] })
          });
          const json = await r.json().catch(() => null);
          const m = json && json.choices && json.choices[0].message;
          return { i: i, status: r.status, ms: performance.now() - start,
            text: r.ok ? ((m && m.content) || "") : errorText(json, r.status) };
        } catch (e) {
          return { i: i, status: 0, ms: performance.now() - start, text: e.message };
        }
      }));
      const total = performance.now() - t0;
      const okCount = results.filter((r) => r.status >= 200 && r.status < 300).length;
      const times = results.map((r) => r.ms).sort((a, b) => a - b);
      const pct = (p) => times[Math.min(times.length - 1, Math.floor(times.length * p))];
      const max = times[times.length - 1] || 1;
      tiles.replaceChildren(
        h("div", { class: "tile " + (okCount === n ? "ok" : "bad") }, h("div", { class: "tile-label", text: "نجح" }), h("div", { class: "tile-value", text: okCount + " / " + n })),
        h("div", { class: "tile" }, h("div", { class: "tile-label", text: "الزمن الكلي" }), h("div", { class: "tile-value", text: fmtMs(total) })),
        h("div", { class: "tile" }, h("div", { class: "tile-label", text: "p50" }), h("div", { class: "tile-value", text: fmtMs(pct(0.5)) })),
        h("div", { class: "tile" }, h("div", { class: "tile-label", text: "p95" }), h("div", { class: "tile-value", text: fmtMs(pct(0.95)) })),
        h("div", { class: "tile" }, h("div", { class: "tile-label", text: "الأبطأ" }), h("div", { class: "tile-value", text: fmtMs(max) })));
      tiles.classList.remove("hidden");
      bars.replaceChildren(h("div", { class: "bars" }, results.map((r) => {
        const ok = r.status >= 200 && r.status < 300;
        return h("div", { class: "bar-row", title: (r.status || "فشل") + " — " + (r.text || "").slice(0, 160) },
          h("span", { class: "idx", text: "#" + (r.i + 1) }),
          h("div", { class: "bar-track" }, h("div", { class: "bar-fill" + (ok ? "" : " err"), style: "width:" + Math.max(1, (r.ms / max) * 100) + "%" })),
          h("span", { class: "ms", text: fmtMs(r.ms) }));
      })), fold("ردود الطلبات", codeBlock(results.map((r) => "#" + (r.i + 1) + "  [" + (r.status || "فشل") + "]  " +
        Math.round(r.ms) + "ms  " + (r.text || "").replace(/\s+/g, " ").slice(0, 100)).join("\n"), true)));
      btn.setBusy(false);
    });
  }

  /* ================= البداية ================= */

  const initial = location.hash.slice(1) || store.get("last_endpoint") || "overview";
  selectEndpoint(ENDPOINTS.some((e) => e.id === initial) ? initial : "overview");
  pingServer();
})();
</script>
</body>
</html>
