<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>back_end_iraqi — لوحة اختبار API</title>
<style>
  :root {
    --bg: #f4f6f2;
    --panel: #ffffff;
    --panel-2: #eceee8;
    --border: #d7ddd2;
    --text: #16201a;
    --text-dim: #5b6b60;
    --accent: #1f7a53;
    --accent-strong: #14603f;
    --accent-soft: #dcefe4;
    --warn: #a35a1f;
    --warn-soft: #f6e6d3;
    --err: #b3311d;
    --err-soft: #f8dcd6;
    --mono-bg: #101a15;
    --mono-text: #d9e6dd;
    --shadow: 0 1px 2px rgba(20, 30, 24, 0.06), 0 4px 16px rgba(20, 30, 24, 0.05);
    --radius: 10px;
  }

  :root[data-theme="dark"] {
    --bg: #0b1210;
    --panel: #121c17;
    --panel-2: #17231d;
    --border: #263229;
    --text: #e7efe9;
    --text-dim: #8a978f;
    --accent: #34b57e;
    --accent-strong: #4fd398;
    --accent-soft: #16302477;
    --warn: #e0a355;
    --warn-soft: #3a2c1877;
    --err: #ea6a56;
    --err-soft: #3a1c1877;
    --mono-bg: #0a1310;
    --mono-text: #cfe3d7;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1210;
      --panel: #121c17;
      --panel-2: #17231d;
      --border: #263229;
      --text: #e7efe9;
      --text-dim: #8a978f;
      --accent: #34b57e;
      --accent-strong: #4fd398;
      --accent-soft: #16302477;
      --warn: #e0a355;
      --warn-soft: #3a2c1877;
      --err: #ea6a56;
      --err-soft: #3a1c1877;
      --mono-bg: #0a1310;
      --mono-text: #cfe3d7;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  code, pre, .mono, .tag, input, textarea, .status-code, .latency {
    font-family: "Cascadia Code", "Consolas", "SF Mono", ui-monospace, monospace;
  }

  body {
    display: grid;
    grid-template-columns: 264px 1fr;
    min-height: 100vh;
  }

  @media (max-width: 880px) {
    body { grid-template-columns: 1fr; }
    .sidebar { position: static; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    border-left: 1px solid var(--border);
    background: var(--panel);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .brand-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  .brand-sub {
    font-size: 12px;
    color: var(--text-dim);
  }

  .base-url-box {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .base-url-box label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .base-url-row {
    display: flex;
    gap: 6px;
  }

  #baseUrl {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 12.5px;
    direction: ltr;
    text-align: left;
  }

  #baseUrl:focus, .base-url-row button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .base-url-row button {
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 0 10px;
    cursor: pointer;
    font-size: 12px;
  }
  .base-url-row button:hover { color: var(--text); border-color: var(--accent); }

  .server-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
    padding: 8px 10px;
    background: var(--panel-2);
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }
  .dot.ok { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .dot.bad { background: var(--err); box-shadow: 0 0 0 3px var(--err-soft); }
  .dot.demo { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
  .dot.pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .dot.pulse { animation: none; } }

  /* ---------- Demo mode toggle ---------- */
  .demo-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--text-dim);
    padding: 8px 10px;
    background: var(--panel-2);
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .demo-toggle input { accent-color: var(--warn); cursor: pointer; }
  .demo-toggle:has(input:checked) { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }

  .demo-banner {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--warn);
    background: var(--warn-soft);
    border: 1px solid var(--warn);
    border-radius: 8px;
    padding: 9px 14px;
    margin-bottom: 16px;
  }
  .demo-banner.show { display: flex; }

  nav.groups {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    flex: 1 1 auto;
    min-height: 120px; /* يضمن مساحة عرض دنيا حتى لو باقي محتوى الشريط طويل */
  }

  /* مفاتيح API مطوية افتراضياً — أربع حقول كانت تاخذ مساحة ثابتة كبيرة
     وتدفع قائمة التنقّل (nav.groups) خارج الشاشة بشاشات قصيرة. مطوية هنا
     تاخذ سطر واحد فقط، وتتمدد عند الحاجة الفعلية للمفاتيح. */
  details.api-keys-details {
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-2);
  }
  details.api-keys-details summary {
    padding: 8px 10px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  details.api-keys-details summary::-webkit-details-marker { display: none; }
  details.api-keys-details summary::before { content: "▸"; font-size: 10px; }
  details.api-keys-details[open] summary::before { content: "▾"; }
  details.api-keys-details summary:hover { color: var(--text); }
  details.api-keys-details .base-url-box { padding: 0 10px 10px; gap: 8px; }

  .group-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 14px 8px 6px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    color: var(--text);
    font-size: 13px;
  }
  .nav-item:hover { background: var(--panel-2); }
  .nav-item.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent-strong);
    font-weight: 600;
  }

  .method-chip {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 5px;
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }
  .method-chip.get { background: var(--accent-soft); color: var(--accent-strong); }
  .method-chip.post { background: var(--warn-soft); color: var(--warn); }

  .nav-item .path {
    direction: ltr;
    text-align: left;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .theme-toggle {
    margin-top: auto;
    display: flex;
    gap: 6px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .theme-toggle button {
    flex: 1;
    padding: 7px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 12px;
  }
  .theme-toggle button.active { color: var(--accent-strong); border-color: var(--accent); background: var(--accent-soft); }

  /* ---------- Main ---------- */
  main {
    padding: 28px 32px 60px;
    max-width: 980px;
    width: 100%;
  }

  .page-header {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 22px;
  }

  .eyebrow {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  h1 {
    font-size: 22px;
    margin: 0;
    text-wrap: balance;
  }

  .endpoint-desc {
    color: var(--text-dim);
    font-size: 13.5px;
    max-width: 62ch;
    line-height: 1.6;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 18px;
  }

  .panel h2 {
    font-size: 13px;
    margin: 0 0 14px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
  }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .field-grid.single { grid-template-columns: 1fr; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 12.5px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }

  .field label .opt {
    font-size: 10.5px;
    color: var(--text-dim);
    opacity: 0.7;
  }

  input[type=text], input[type=number], textarea, select {
    padding: 9px 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13.5px;
    width: 100%;
    resize: vertical;
  }

  textarea { min-height: 68px; font-family: inherit; direction: rtl; }
  input[type=text]:focus, input[type=number]:focus, textarea:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }

  .radio-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .radio-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    font-size: 12.5px;
    cursor: pointer;
    color: var(--text-dim);
  }
  .radio-row input { accent-color: var(--accent); }
  .radio-row label:has(input:checked) { color: var(--accent-strong); border-color: var(--accent); background: var(--accent-soft); }

  .file-drop {
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 14px;
    font-size: 12.5px;
    color: var(--text-dim);
    background: var(--panel-2);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .file-drop input[type=file] { font-size: 12px; color: var(--text-dim); }

  .actions-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
  }

  button.primary {
    background: var(--accent);
    color: #f4fbf7;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  button.primary:hover { background: var(--accent-strong); }
  button.primary:disabled { opacity: 0.55; cursor: progress; }
  button.primary:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  button.ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  button.ghost:hover { color: var(--text); border-color: var(--accent); }

  .spinner {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .spinner.show { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

  .session-pill {
    font-size: 11.5px;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    display: none;
    align-items: center;
    gap: 6px;
  }
  .session-pill.show { display: inline-flex; }
  .session-pill .val { direction: ltr; color: var(--text); }

  /* ---------- Response ---------- */
  .response-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .status-code {
    font-size: 12px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text-dim);
  }
  .status-code.s2 { background: var(--accent-soft); color: var(--accent-strong); }
  .status-code.s4, .status-code.s5 { background: var(--err-soft); color: var(--err); }

  .engine-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 6px;
    letter-spacing: 0.2px;
  }
  .engine-pill.vllm { background: var(--accent-soft); color: var(--accent-strong); }
  .engine-pill.fallback { background: var(--warn-soft); color: var(--warn); }
  .engine-pill.deterministic { background: var(--panel-2); color: var(--text-dim); }
  .engine-pill.demo { background: var(--warn-soft); color: var(--warn); }

  .latency {
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .chat-log {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
  }

  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13.5px;
    line-height: 1.65;
    white-space: pre-wrap;
  }
  .bubble.user {
    align-self: flex-start;
    background: var(--panel-2);
    border: 1px solid var(--border);
  }
  .bubble.assistant {
    align-self: flex-end;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    color: var(--text);
  }
  .bubble .who {
    font-size: 10.5px;
    color: var(--text-dim);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .bubble .img-note {
    margin-top: 6px;
    font-size: 11.5px;
    color: var(--text-dim);
  }

  pre.json-view {
    background: var(--mono-bg);
    color: var(--mono-text);
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 12.5px;
    line-height: 1.6;
    overflow-x: auto;
    direction: ltr;
    text-align: left;
    margin: 0;
  }
  .jk { color: #7fc7e0; }
  .js { color: #b9d98a; }
  .jn { color: #e0b45f; }
  .jb { color: #e08fa0; }

  /* استدعاء أداة (search_products / get_order_status) — عرض بسيط بين
     فقاعات المحادثة، مو بطاقة معقّدة: اسم الأداة + المعاملات + عدد
     النتائج، مع تفصيل النتيجة الكاملة قابل للطي. */
  .tool-call {
    align-self: flex-start;
    max-width: 82%;
    font-size: 12px;
    border: 1px dashed var(--border);
    background: var(--panel-2);
    border-radius: 10px;
    padding: 8px 12px;
    color: var(--text-dim);
  }
  .tool-call .head {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tool-call .tool-name {
    font-family: "Cascadia Code", Consolas, monospace;
    font-weight: 700;
    color: var(--accent-strong);
    direction: ltr;
  }
  .tool-call .tool-args {
    font-family: "Cascadia Code", Consolas, monospace;
    direction: ltr;
    color: var(--text-dim);
  }
  .tool-call details { margin-top: 6px; }
  .tool-call summary { cursor: pointer; user-select: none; }
  .tool-call summary:hover { color: var(--accent-strong); }
  .tool-call pre.json-view { margin-top: 6px; max-height: 220px; overflow: auto; padding: 10px 12px; font-size: 11.5px; }

  .order-card {
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .order-card h3 {
    margin: 0 0 8px;
    font-size: 13px;
    color: var(--accent-strong);
  }
  .order-card table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .order-card td { padding: 3px 0; }
  .order-card .num { font-variant-numeric: tabular-nums; direction: ltr; text-align: left; }

  /* خانة JSON الطلب — منفصلة عن ملخّص البطاقة حتى تنقرأ وتُنسخ لوحدها */
  .order-json { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  .order-json summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--text-dim);
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .order-json summary:hover { color: var(--accent-strong); }
  .order-json summary::-webkit-details-marker { display: none; }
  .order-json summary::before { content: "▸"; font-size: 10px; }
  .order-json[open] summary::before { content: "▾"; }
  .order-json .copy-json {
    margin-inline-start: auto;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
  }
  .order-json .copy-json:hover { color: var(--accent-strong); border-color: var(--accent); }
  /* التنسيق من pre.json-view المعتمد بالصفحة — هنا الفروق فقط */
  .order-json pre { margin-top: 8px; max-height: 340px; overflow: auto; }

  .empty-state {
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    padding: 32px 0;
  }

  .curl-box {
    margin-top: 14px;
  }
  .curl-box summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--text-dim);
    user-select: none;
  }
  .curl-box summary:hover { color: var(--accent); }
  .curl-box pre {
    margin-top: 8px;
  }

  footer.hint {
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    padding-top: 8px;
  }

  ::selection { background: var(--accent-soft); }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="brand-title">back_end_iraqi</div>
    <div class="brand-sub">لوحة اختبار API</div>
  </div>

  <div class="base-url-box">
    <label for="baseUrl">رابط السيرفر (Base URL)</label>
    <div class="base-url-row">
      <input id="baseUrl" type="text" value="http://localhost:8000" spellcheck="false" />
      <button id="pingBtn" title="فحص الاتصال">فحص</button>
    </div>
  </div>

  <div class="server-status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">لم يُفحص بعد</span>
  </div>

  <label class="demo-toggle" id="demoToggle" title="يفعّل بيانات تجريبية محلية بدل الاتصال الفعلي — جرّب الصفحة كاملة بلا سيرفر">
    <input type="checkbox" id="demoModeCheck" />
    <span>وضع تجريبي (بلا سيرفر)</span>
  </label>

  <details class="api-keys-details" id="apiKeysBox">

<script>
(function () {
  "use strict";

  /* ---------------- Theme ---------------- */
  var root = document.documentElement;
  function setTheme(mode) {
    if (mode === "auto") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", mode);
    ["themeAuto", "themeLight", "themeDark"].forEach(function (id) {
      document.getElementById(id).classList.remove("active");
    });
    document.getElementById("theme" + mode[0].toUpperCase() + mode.slice(1)).classList.add("active");
    try { localStorage.setItem("iraqi_theme", mode); } catch (e) {}
  }
  document.getElementById("themeAuto").onclick = function () { setTheme("auto"); };
  document.getElementById("themeLight").onclick = function () { setTheme("light"); };
  document.getElementById("themeDark").onclick = function () { setTheme("dark"); };
  try {
    var savedTheme = localStorage.getItem("iraqi_theme");
    if (savedTheme) setTheme(savedTheme);
  } catch (e) {}

  /* ---------------- Base URL persistence ---------------- */
  var baseUrlInput = document.getElementById("baseUrl");
  try {
    var savedUrl = localStorage.getItem("iraqi_base_url");
    if (savedUrl) baseUrlInput.value = savedUrl;
    else baseUrlInput.value = window.location.origin.startsWith("http") && window.location.protocol !== "file:"
      ? window.location.origin
      : "http://localhost:8000";
  } catch (e) {}
  baseUrlInput.addEventListener("change", function () {
    try { localStorage.setItem("iraqi_base_url", baseUrlInput.value.trim()); } catch (e) {}
  });
  function baseUrl() {
    return baseUrlInput.value.trim().replace(/\/+$/, "");
  }

  /* ---------------- API keys persistence (مفتاح مستقل لكل خدمة) ---------------- */
  var apiKeyInputs = {
    sales: document.getElementById("salesApiKey"),
    support: document.getElementById("supportApiKey"),
    orders: document.getElementById("ordersApiKey"),
    voiceFollowup: document.getElementById("voiceFollowupApiKey")
  };
  Object.keys(apiKeyInputs).forEach(function (svc) {
    var input = apiKeyInputs[svc];
    try {
      var saved = localStorage.getItem("iraqi_api_key_" + svc);
      if (saved) input.value = saved;
    } catch (e) {}
    input.addEventListener("change", function () {
      try { localStorage.setItem("iraqi_api_key_" + svc, input.value.trim()); } catch (e) {}
    });
  });
  // يقرأ مفتاح خدمة معيّنة وقت الإرسال (لا وقت التحميل) حتى يعكس آخر قيمة
  // كتبها المستخدم فوراً بلا الحاجة لضغط Enter أو فقدان تركيز الحقل.
  function apiKeyFor(service) {
    return apiKeyInputs[service] ? apiKeyInputs[service].value.trim() : "";
  }
  // هيدر جاهز للإرسال المباشر بـ fetch — يرجع {} إذا الحقل فارغ (fetch تتجاهل
  // هيدر بقيمة فارغة، فالسيرفر يرفضها بـ422 وضّاح بدل ما نرسل نصاً فارغاً).
  function apiKeyHeader(service) {
    var key = apiKeyFor(service);
    return key ? { "X-API-Key": key } : {};
  }

  /* ---------------- وضع تجريبي (Demo Mode) — بلا سيرفر حقيقي ----------------
     يفعّل بيانات وهمية محلية بدل الاتصال الفعلي، حتى تفتح الصفحة مباشرة
     (file:// أو بأي استضافة ثابتة) وتجرّب كل الميزات بلا تشغيل uvicorn ولا
     خادم vLLM. البيانات الوهمية (كتالوج المنتجات وسجل الطلبات) مبنية حرفياً
     على عقد باك اند السستم الموثَّق بـ app/system_backend_schema.py وAPI.md
     § "عقد باك اند السستم" (SystemProduct/SystemOrder) — نفس أسماء الحقول
     تماماً، فالصفحة تتصرف بنفس الشكل سواء كانت البيانات حقيقية أو تجريبية. */
  var demoModeCheck = document.getElementById("demoModeCheck");
  var demoToggle = document.getElementById("demoToggle");
  try {
    demoModeCheck.checked = localStorage.getItem("iraqi_demo_mode") === "1";
  } catch (e) {}
  function isDemoMode() { return demoModeCheck.checked; }
  demoModeCheck.addEventListener("change", function () {
    try { localStorage.setItem("iraqi_demo_mode", demoModeCheck.checked ? "1" : "0"); } catch (e) {}
    pingServer();
  });

  // كتالوج منتجات وهمي — كل عنصر يطابق حقول SystemProduct حرفياً (id, name,
  // sku, barcode, description, category, price, currency, in_stock,
  // stock_quantity, photos, deleted_at).
  var DEMO_PRODUCTS = [
    { id: "P-1001", name: "لابتوب لينوفو IdeaPad 15", sku: "LEN-IP15-8GB", barcode: "8801643214567",
      description: "معالج Core i5، رام 8 جيجا، تخزين SSD 512 جيجا، شاشة 15.6 انج.",
      category: "لابتوبات", price: 750000, currency: "IQD", in_stock: true, stock_quantity: 14,
      photos: [], deleted_at: null },
    { id: "P-1002", name: "لابتوب Asus VivoBook 14", sku: "ASU-VB14-16GB", barcode: "8801643214789",
      description: "معالج Core i7، رام 16 جيجا، تخزين SSD 1 تيرا، كارت شاشة منفصل.",
      category: "لابتوبات", price: 980000, currency: "IQD", in_stock: true, stock_quantity: 5,
      photos: [], deleted_at: null },
    { id: "P-2001", name: "مكيف سبلت LG انفرتر 1.5 طن", sku: "LG-SPL-15T", barcode: "8801643298001",
      description: "بارد فقط، توفير طاقة انفرتر، تبريد سريع.",
      category: "مكيفات", price: 620000, currency: "IQD", in_stock: true, stock_quantity: 9,

    { id: "P-2002", name: "مكيف سبلت سامسونك 2 طن", sku: "SAM-SPL-2T", barcode: "8801643298045",

      category: "مكيفات", price: 890000, currency: "IQD", in_stock: false, stock_quantity: 0,

    { id: "P-3001", name: "ماوس لوجيتك لاسلكي", sku: "LOG-M185", barcode: "8801643255012",
      description: "لاسلكي 2.4G، بطارية تدوم سنة، تصميم مريح.",
      category: "ملحقات", price: 15000, currency: "IQD", in_stock: true, stock_quantity: 40,
      photos: [], deleted_at: null },
    { id: "P-4001", name: "غسالة اتوماتيك سامسونك 8 كغم", sku: "SAM-WM8KG", barcode: "8801643277003",
      description: "تحميل امامي، برامج غسيل متعددة، توفير مياه.",
      category: "غسالات", price: 540000, currency: "IQD", in_stock: true, stock_quantity: 3,
      photos: [], deleted_at: null }
  ];

  // سجل طلبات وهمي — كل عنصر يطابق حقول SystemOrder حرفياً (order_id, status,
  // customer_name, phone, customer_city, customer_district, address, items,
  // total, currency, eta, created_at).
  var DEMO_ORDERS = [
    { order_id: "ORD-1001", status: "قيد التوصيل", customer_name: "أحمد كاظم", phone: "07701234567",
      customer_city: "بغداد", customer_district: "الكرادة", address: "بغداد - الكرادة - قرب مطعم النخيل",
      items: [{ product_id: "P-1001", product_name: "لابتوب لينوفو IdeaPad 15", quantity: 1, unit_price: 750000, line_total: 750000 }],
      total: 750000, currency: "IQD", eta: "خلال يومين", created_at: "2026-08-02T10:15:00Z" },
    { order_id: "ORD-1002", status: "تم التسليم", customer_name: "زينب علي", phone: "07801122334",
      customer_city: "البصرة", customer_district: "العشار", address: "البصرة - العشار - شارع الكورنيش",
      items: [{ product_id: "P-3001", product_name: "ماوس لوجيتك لاسلكي", quantity: 2, unit_price: 15000, line_total: 30000 }],
      total: 30000, currency: "IQD", eta: null, created_at: "2026-07-28T09:00:00Z" },
    { order_id: "ORD-1003", status: "قيد التجهيز", customer_name: "مصطفى جبار", phone: "07709988776",
      customer_city: "اربيل", customer_district: "عنكاوا", address: "اربيل - عنكاوا",
      items: [{ product_id: "P-2001", product_name: "مكيف سبلت LG انفرتر 1.5 طن", quantity: 1, unit_price: 620000, line_total: 620000 }],
      total: 620000, currency: "IQD", eta: "خلال ٣ أيام", created_at: "2026-08-03T14:30:00Z" },
    { order_id: "ORD-1004", status: "ملغي", customer_name: "نور حيدر", phone: "07901112233",
      customer_city: "بغداد", customer_district: "المنصور", address: "بغداد - المنصور",
      items: [{ product_id: "P-4001", product_name: "غسالة اتوماتيك سامسونك 8 كغم", quantity: 1, unit_price: 540000, line_total: 540000 }],
      total: 540000, currency: "IQD", eta: null, created_at: "2026-07-20T11:00:00Z" }
  ];

  function demoSearchProducts(query, topK, category, inStockOnly) {
    var q = (query || "").trim();
    var results = DEMO_PRODUCTS.filter(function (p) {
      if (category && p.category !== category) return false;
      if (inStockOnly && !p.in_stock) return false;
      if (!q) return true;
      var hay = (p.name + " " + p.category + " " + p.description).toLowerCase();
      return hay.indexOf(q.toLowerCase()) !== -1 || q.split(/\s+/).some(function (w) {
        return w && hay.indexOf(w.toLowerCase()) !== -1;
      });
    });
    return results.slice(0, topK || 5);
  }

  function demoAnswerFor(message, kind) {
    // رد وكيل مبسّط لكن واقعي — يبحث بكتالوج الديمو فعلياً (نفس منطق أداة
    // search_products) ويبني جملة عراقية من النتيجة، بدل نص ثابت واحد.
    var hits = demoSearchProducts(message, 3, null, false);
    if (kind === "support") {
      var orderMatch = /ORD[\s\-_]*(\d+)/i.exec(message);
      if (orderMatch) {
        var order = DEMO_ORDERS.find(function (o) { return o.order_id === "ORD-" + orderMatch[1]; });
        if (order) {
          // نفس منطق _format_order_reply (app/features/support/router.py):
          // نذكر المنتجات لا رقم الطلب الداخلي بالرد.
          var demoSubject = (order.items || []).map(function (it) { return it.product_name; }).join("، ") || "طلبك";
          return "هلا بيك، " + demoSubject + " حالته: " + order.status +
            (order.eta ? "، والوصول المتوقع " + order.eta : "") + ". [بيانات تجريبية]";
        }
        return "والله ماكو طلب بهذا الرقم بالبيانات التجريبية — جرّب ORD-1001 لين ORD-1004.";
      }
      var phoneMatch = /07\d{9}/.exec(message.replace(/[\s\-]/g, ""));
      if (phoneMatch) {
        var byPhone = DEMO_ORDERS.filter(function (o) { return o.phone === phoneMatch[0]; });
        if (byPhone.length) {
          return "هلا بيك، هذي طلباتك: " + byPhone.map(function (o) {
            var subject = (o.items || []).map(function (it) { return it.product_name; }).join("، ") || o.order_id;
            return subject + " (" + o.status + ")";
          }).join(" | ") + ". [بيانات تجريبية]";
        }
      }
      return "عطيني رقم الطلب (مثل ORD-1001) أو رقم الهاتف حتى اكدر اكَولك وين وصل. [بيانات تجريبية]";
    }
    if (!hits.length) {
      return "عذراً حبيبي، ماكو منتج مطابق بالكتالوج التجريبي هسه — جرّب تسأل عن لابتوب أو مكيف أو غسالة. [بيانات تجريبية]";
    }
    var p = hits[0];
    var alt = hits.slice(1).map(function (a) { return "- " + a.name + " — " + a.price.toLocaleString() + " دينار"; });
    return "هلا بيك، عدنا " + p.name + " بسعر " + p.price.toLocaleString() + " دينار (" +
      (p.in_stock ? "متوفر بالمخزون" : "غير متوفر حالياً") + ").\nبإيجاز عن الجهاز:\n- " + p.description +
      (alt.length ? "\n\nبدائل متوفرة:\n" + alt.join("\n") : "") +
      "\nتحب أحجزلك وحدة أو أساعدك تختار الأنسب؟ [بيانات تجريبية]";
  }

  var demoSessionCounter = 0;
  function demoSessionId() { return "demo-session-" + (++demoSessionCounter) + "-" + Date.now(); }

  // يحاكي fetch لكل نقطة تُستخدم بالصفحة — يرجع Response حقيقي (عبر
  // Response constructor) حتى بقية الكود (res.json/res.ok/res.status) يشتغل
  // بلا أي تعديل بمكان ثاني.
  async function mockFetch(url, options) {
    options = options || {};
    var path = url.replace(baseUrl(), "").split("?")[0];
    var delay = 250 + Math.random() * 350;
    await new Promise(function (r) { setTimeout(r, delay); });

    function jsonResponse(body, status) {
      return new Response(JSON.stringify(body), {
        status: status || 200,
        headers: { "Content-Type": "application/json" }
      });
    }

    if (path === "/health") return jsonResponse({ status: "healthy" });
    if (path === "/gpu") {
      return jsonResponse({
        torch: "2.8.0", cuda: true, vllm_ready: true, device_count: 1,
        device_name: "NVIDIA A100-SXM4-80GB (تجريبي)", cuda_version: "12.8",
        vram_total_gb: 80.0, vram_free_gb: 61.2
      });
    }
    if (path === "/") return jsonResponse({ status: "ok", service: "back_end_iraqi", docs: "/docs" });

    // منطق مشترك بين /sales/chat و/support/chat (الكامل والمبثوث): يبني
    // toolCalls + answer من نفس كتالوج/سجل الديمو، مرة واحدة بدل تكرارها
    // بكل مسار من الأربعة.
    function demoChatTurn(path, body) {
      var isSupport = path.indexOf("/support/") === 0;
      var message = body.message || "";
      var hits = demoSearchProducts(message, 5, null, false);
      var toolCalls = [];
      if (!isSupport && hits.length) {
        toolCalls.push({
          tool: "search_products",
          args: { query: message, top_k: 5 },
          result: hits.length ? { results: hits } : { results: [], message: "ماكو منتج مطابق بالكتالوج." }
        });
      }
      if (isSupport) {
        var orderMatch = /ORD[\s\-_]*(\d+)/i.exec(message);
        if (orderMatch) {
          var found = DEMO_ORDERS.find(function (o) { return o.order_id === "ORD-" + orderMatch[1]; });
          toolCalls.push({
            tool: "get_order_status",
            args: { order_id: "ORD-" + orderMatch[1] },
            result: found || { error: "ماكو طلب بهذا الرقم" }
          });
        }
      }
      return {
        session_id: body.session_id || demoSessionId(),
        answer: demoAnswerFor(message, isSupport ? "support" : "sales"),
        toolCalls: toolCalls
      };
    }

    if (path === "/sales/chat" || path === "/support/chat") {
      var body = JSON.parse(options.body || "{}");
      var turn = demoChatTurn(path, body);
      return jsonResponse({
        session_id: turn.session_id,
        answer: turn.answer,
        engine: "demo",
        order: null,
        tool_calls: turn.toolCalls
      });
    }

    if (path === "/sales/chat/stream" || path === "/support/chat/stream") {
      // نبني رد SSE نصي حقيقي (نفس تنسيق "data: {...}\n\n" الذي يرسله
      // الخادم الحقيقي) داخل ReadableStream — حتى renderChatStreamForm
      // (اللي تستهلك res.body.getReader() مباشرة) تشتغل بلا أي تعديل، سواء
      // كان الرد حقيقياً أو تجريبياً.
      var streamBody = JSON.parse(options.body || "{}");
      var streamTurn = demoChatTurn(path, streamBody);
      var words = streamTurn.answer.split(/(\s+)/); // يحافظ على الفراغات كأجزاء
      var encoder = new TextEncoder();

      var readable = new ReadableStream({
        async start(controller) {
          for (var i = 0; i < words.length; i++) {
            await new Promise(function (r) { setTimeout(r, 25 + Math.random() * 35); });
            controller.enqueue(encoder.encode(
              "data: " + JSON.stringify({ delta: words[i] }) + "\n\n"
            ));
          }
          controller.enqueue(encoder.encode(
            "data: " + JSON.stringify({
              done: true,
              session_id: streamTurn.session_id,
              tool_calls: streamTurn.toolCalls
            }) + "\n\n"
          ));
          controller.close();
        }
      });
      return new Response(readable, { status: 200, headers: { "Content-Type": "text/event-stream" } });
    }

    if (path === "/orders/create") {
      // multipart — لا نقرأ options.body (FormData) بتفصيل، نرجع طلباً
      // تجريبياً كاملاً يطابق شكل OrderConfirmation الحقيقي.
      return jsonResponse({
        order_id: "ORD-DEMO-" + Math.floor(1000 + Math.random() * 9000),
        created_at: new Date().toISOString(),
        customer_name: "زبون تجريبي",
        customer_phone: "07701234567",
        customer_phone2: null,
        customer_address: "بغداد - الكرادة",
        customer_city: "بغداد",
        customer_district: "الكرادة",
        state_code: "BGD",
        items: [
          { product_id: "P-1001", product_name: "لابتوب لينوفو IdeaPad 15", quantity: 1, unit_price: 750000, currency: "IQD", line_total: 750000, matched: true },
          { product_id: "P-3001", product_name: "ماوس لوجيتك لاسلكي", quantity: 1, unit_price: 15000, currency: "IQD", line_total: 15000, matched: true }
        ],
        suggested_product: null,
        subtotal: 765000,
        total: 765000,
        currency: "IQD",
        quoted_price: null,
        notes: null,
        confirmation_message: "تم تثبيت الطلب (بيانات تجريبية) — هذا رد وهمي لا يُرسل لأي باك اند حقيقي."
      });
    }

    return jsonResponse({ detail: "مسار غير مدعوم بالوضع التجريبي: " + path }, 404);
  }

  // بديل موحّد لـ fetch: يوجّه لـ mockFetch وقت الوضع التجريبي، وإلا fetch
  // الحقيقي كالمعتاد. كل نقاط JSON العادية (health/gpu/root/sales/support/
  // orders create) تمر من هنا بلا أي تغيير بمنطقها. مسارات voice_followup
  // (صوت حقيقي داخل/خارج) لها معالجة تجريبية منفصلة داخل renderVoiceFollowupForm
  // وrenderVoiceReturnForm — والأخيرة متعددة الأدوار (تكرّر /respond).
  // لأنها ترجع audio/wav لا JSON.
  function apiFetch(url, options) {
    return isDemoMode() ? mockFetch(url, options) : fetch(url, options);
  }

  /* ---------------- Server status ping ---------------- */
  var statusDot = document.getElementById("statusDot");
  var statusText = document.getElementById("statusText");

  async function pingServer() {
    if (isDemoMode()) {
      statusDot.className = "dot demo";
      statusText.textContent = "وضع تجريبي — بلا سيرفر حقيقي";
      return;
    }
    statusDot.className = "dot pulse";
    statusText.textContent = "جاري الفحص...";
    try {
      var t0 = performance.now();
      var res = await fetch(baseUrl() + "/health", { method: "GET" });
      var ms = Math.round(performance.now() - t0);
      if (res.ok) {
        var gpuRes = await fetch(baseUrl() + "/gpu").then(function (r) { return r.json(); }).catch(function () { return null; });
        var modelReady = gpuRes && gpuRes.vllm_ready;
        statusDot.className = "dot ok";
        statusText.textContent = modelReady
          ? "متصل — الموديل جاهز (" + ms + "ms)"
          : "متصل — وضع fallback بدون GPU (" + ms + "ms)";
      } else {
        statusDot.className = "dot bad";
        statusText.textContent = "خطأ HTTP " + res.status;
      }
    } catch (e) {
      statusDot.className = "dot bad";
      statusText.textContent = "تعذّر الاتصال بالسيرفر";
    }
  }
  document.getElementById("pingBtn").onclick = pingServer;

  /* ---------------- JSON pretty-print with light syntax highlight ---------------- */
  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; });
  }

  // يحوّل ملف صورة لـ base64 خام (بلا بادئة data:...;base64,) — نفس الصيغة
  // اللي يتوقعها حقل image_base64 بـ POST /sales/chat (انظر API.md).
  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result.split(",", 2)[1] || ""); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function highlightJson(obj) {
    var str = JSON.stringify(obj, null, 2);
    var escaped = escapeHtml(str);
    return escaped.replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,
      function (match) {
        var cls = "jn";
        if (/^"/.test(match)) cls = /:$/.test(match) ? "jk" : "js";
        else if (/true|false/.test(match)) cls = "jb";
        else if (/null/.test(match)) cls = "jb";
        return '<span class="' + cls + '">' + match + "</span>";
      }
    );
  }

  function statusClass(code) {
    if (code >= 200 && code < 300) return "s2";
    if (code >= 400 && code < 500) return "s4";
    if (code >= 500) return "s5";
    return "";
  }

  function makeButton(text) {

  function curlBlock(method, path, bodyObj, isMultipart, fields) {
    var details = document.createElement("details");
    details.className = "curl-box";
    var summary = document.createElement("summary");
    summary.textContent = "عرض أمر curl المكافئ";
    details.appendChild(summary);
    var pre = document.createElement("pre");
    pre.className = "json-view";
    var cmd;
    if (isMultipart) {
      cmd = "curl -X POST " + baseUrl() + path + " \\\n" +
        fields.map(function (f) { return '  -F "' + f.name + "=" + (f.isFile ? "@" + f.value : f.value) + '"'; }).join(" \\\n");
    } else {
      cmd = "curl -X " + method + " " + baseUrl() + path +
        (bodyObj ? " \\\n  -H \"Content-Type: application/json\" \\\n  -d '" + JSON.stringify(bodyObj) + "'" : "");
    }
    pre.textContent = cmd;
    details.appendChild(pre);
    return details;
  }

  function updateCurl(container, node) {
    var old = container.querySelector(".curl-box");
    if (old) old.remove();
    container.appendChild(node);
  }

    countField.className = "field";
    countField.innerHTML = '<label>عدد الطلبات المتزامنة</label>';
    var countInput = document.createElement("input");
    countInput.type = "number";
    countInput.min = "1";
    countInput.max = "32";
    countInput.value = "5";
    countField.appendChild(countInput);
    grid.appendChild(countField);

    panel.appendChild(grid);
    var btn = makeButton("أطلق الطلبات");
    panel.appendChild(makeActionsRow(btn));
    container.appendChild(panel);

    var resultPanel = makePanel("النتائج");
    var meta = document.createElement("div");
    meta.className = "response-meta";
    var body = document.createElement("div");
    body.innerHTML = '<div class="empty-state">حدد العدد واضغط "أطلق الطلبات" — كل الطلبات تنطلق بنفس اللحظة.</div>';
    resultPanel.appendChild(meta);
    resultPanel.appendChild(body);
    container.appendChild(resultPanel);

    btn.onclick = async function () {
      var n = Math.max(1, Math.min(32, parseInt(countInput.value, 10) || 1));
      btn.setBusy(true);
      meta.innerHTML = "";
      body.innerHTML = '<div class="empty-state">جاري إرسال ' + n + " طلب متزامن... (المحرك يعالجها بالتتابع، الأخير ينتظر الجميع)</div>";

      var t0 = performance.now();
      var tasks = [];
      for (var i = 0; i < n; i++) {
        (function (idx) {
          var reqStart = performance.now();
          tasks.push(
            fetch(baseUrl() + "/sales/chat", {
              method: "POST",
              headers: Object.assign({ "Content-Type": "application/json" }, apiKeyHeader("sales")),
              // بدون session_id — كل طلب جلسة مستقلة حتى ما تتداخل الذاكرة
              body: JSON.stringify({ message: msgInput.value + " (#" + (idx + 1) + ")" })
            })
              .then(function (res) {
                return res.json().then(function (json) {
                  return { idx: idx, status: res.status, ms: Math.round(performance.now() - reqStart), answer: (json && json.answer) || "" };
                });
              })
              .catch(function (e) {
                return { idx: idx, status: 0, ms: Math.round(performance.now() - reqStart), answer: "خطأ: " + e.message };
              })
          );
        })(i);
      }

      var results = await Promise.all(tasks);
      var totalMs = Math.round(performance.now() - t0);
      var ok = results.filter(function (r) { return r.status >= 200 && r.status < 300; }).length;
      var times = results.map(function (r) { return r.ms; }).sort(function (a, b) { return a - b; });
      var avg = Math.round(times.reduce(function (s, v) { return s + v; }, 0) / times.length);
      var p95 = times[Math.min(times.length - 1, Math.floor(times.length * 0.95))];

      meta.innerHTML =
        '<span class="status-code ' + (ok === n ? "s2" : "s5") + '">' + ok + "/" + n + " نجح</span>" +
        '<span class="latency">إجمالي: ' + totalMs + " ms</span>" +
        '<span class="latency">متوسط: ' + avg + " ms</span>" +
        '<span class="latency">p95: ' + p95 + " ms</span>";

      body.innerHTML = "";
      var table = document.createElement("pre");
      table.className = "json-view";
      table.textContent = results
        .sort(function (a, b) { return a.idx - b.idx; })
        .map(function (r) {
          return "#" + (r.idx + 1) + "  [" + (r.status || "فشل") + "]  " + r.ms + "ms  " +
            (r.answer ? r.answer.slice(0, 80) : "");
        })
        .join("\n");
      body.appendChild(table);
      btn.setBusy(false);
    };
  }

    resetBtn.onclick = function () {
      sessionId = null;
      sessionPill.classList.remove("show");
      chatLog.innerHTML = "";
      orderBox.innerHTML = "";
    };
    var actionsRow = document.createElement("div");
    actionsRow.className = "actions-row";
    actionsRow.appendChild(btn);
    actionsRow.appendChild(sessionPill);
    actionsRow.appendChild(resetBtn);
    panel.appendChild(actionsRow);
    container.appendChild(panel);

    var resultPanel = makePanel("المحادثة (بث SSE)");
    var meta = document.createElement("div");
    meta.className = "response-meta";
    var chatLog = document.createElement("div");
    chatLog.className = "chat-log";
    var orderBox = document.createElement("div");
    resultPanel.appendChild(meta);
    resultPanel.appendChild(chatLog);
    resultPanel.appendChild(orderBox);
    container.appendChild(resultPanel);

    btn.onclick = async function () {
      var message = msgInput.value.trim();
      if (!message) return;
      btn.setBusy(true);
      meta.innerHTML = '<span class="latency">جاري البث...</span>';

      var userBubble = document.createElement("div");
      userBubble.className = "bubble user";
      userBubble.innerHTML = '<div class="who">العميل</div>' + escapeHtml(message);
      chatLog.appendChild(userBubble);

      var assistantBubble = document.createElement("div");
      assistantBubble.className = "bubble assistant";
      assistantBubble.innerHTML = '<div class="who">الوكيل</div><span class="stream-text"></span>';
      chatLog.appendChild(assistantBubble);
      var streamText = assistantBubble.querySelector(".stream-text");
      chatLog.scrollTop = chatLog.scrollHeight;

      var payload = { message: message, session_id: sessionId };
      var t0 = performance.now();
      orderBox.innerHTML = "";

      try {
        var res = await apiFetch(baseUrl() + ep.path, {
          method: "POST",
          headers: Object.assign({ "Content-Type": "application/json" }, apiKeyHeader(ep.apiKeyService)),
          body: JSON.stringify(payload)
        });
        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var buffer = "";
        var full = "";
        var firstTokenMs = null;

        while (true) {
          var chunk = await reader.read();
          if (chunk.done) break;
          buffer += decoder.decode(chunk.value, { stream: true });
          var parts = buffer.split("\n\n");
          buffer = parts.pop();
          for (var i = 0; i < parts.length; i++) {
            var line = parts[i];
            if (!line.startsWith("data: ")) continue;
            var evt = JSON.parse(line.slice(6));
            if (evt.delta !== undefined) {
              if (firstTokenMs === null) firstTokenMs = Math.round(performance.now() - t0);
              full += evt.delta;
              streamText.textContent = full;
              chatLog.scrollTop = chatLog.scrollHeight;
            }
            if (evt.done) {
              var totalMs = Math.round(performance.now() - t0);
              sessionId = evt.session_id;
              sessionPill.querySelector(".val").textContent = sessionId;
              sessionPill.classList.add("show");
              meta.innerHTML =
                '<span class="status-code s2">' + res.status + "</span>" +
                '<span class="latency">أول توكن: ' + (firstTokenMs === null ? "—" : firstTokenMs + "ms") + " · إجمالي: " + totalMs + "ms</span>";
              renderToolCalls(chatLog, evt.tool_calls);
              if (evt.order) orderBox.appendChild(renderOrderCard(evt.order));
            }
          }
        }
        updateCurl(resultPanel, curlBlock("POST", ep.path, payload));
      } catch (e) {
        meta.innerHTML = '<span class="status-code s5">خطأ</span>';
        streamText.textContent = "تعذّر الوصول للسيرفر: " + e.message;
      }
      btn.setBusy(false);
      msgInput.value = "";
    };
  }

        respondBody.innerHTML = "";
        var transcriptBubble = document.createElement("div");
        transcriptBubble.className = "bubble user";
        transcriptBubble.innerHTML = '<div class="who">رد الزبون (نص من Whisper)</div>' + escapeHtml(transcript || "—");
        respondBody.appendChild(transcriptBubble);

        var reasonBubble = document.createElement("div");
        reasonBubble.className = "bubble assistant";
        reasonBubble.innerHTML = '<div class="who">ملخّص السبب</div>' + escapeHtml(reasonSummary || "—");
        respondBody.appendChild(reasonBubble);

        var audioEl = document.createElement("audio");
        audioEl.controls = true;
        audioEl.autoplay = true;
        audioEl.src = audioUrl;
        audioEl.style.width = "100%";
        audioEl.style.marginTop = "10px";
        respondBody.appendChild(audioEl);

        // جلسة استُهلكت (session_store.pop) — نصفّرها حتى ما يُعاد استعمالها.
        sessionId = null;
        askSessionPill.classList.remove("show");
      } catch (e) {
        respondMeta.innerHTML = '<span class="status-code s5">خطأ</span>';
        respondBody.innerHTML = '<div class="empty-state">تعذّر الوصول للسيرفر: ' + escapeHtml(e.message) + "</div>";
      }
      respondBtn.setBusy(false);
    };
  }

  /* ---------------- Voice return (مكالمة "راجع" — متعددة الأدوار) ---------------- */
  // تختلف بنيوياً عن renderVoiceFollowupForm أعلاه: هناك دور واحد يُغلق
  // الجلسة فوراً، وهنا المكالمة تستمر — /respond يُستدعى مراراً بنفس
  // session_id لين X-Call-Status يرجع "ended". لذلك نراكم الأدوار بسجل
  // محادثة واحد بدل ما نستبدل محتوى اللوحة بكل دور.
  function renderVoiceReturnForm(container, ep) {
    var sessionId = null;
    var turnIndex = 0;
    var defaultOrder = {
      order_id: "ORD-1042",
      status: "راجع",
      store_name: "متجر النور",
      amount: 75000,
      currency: "دينار",
      items: [{ product_name: "غسالة اتوماتيك", quantity: 1 }],
      return_reason_hint: "لم يطلب",
      goods_description: null,
      tracking_number: null
    };

    /* ---- الخطوة 1: POST /voice_return/start ---- */
    var startPanel = makePanel("الخطوة ١ — بيانات الشحنة الراجعة (JSON قابل للتعديل)");
    var orderField = document.createElement("div");
    orderField.className = "field";
    var orderTextarea = document.createElement("textarea");
    orderTextarea.style.minHeight = "200px";
    orderTextarea.style.direction = "ltr";
    orderTextarea.style.textAlign = "left";
    orderTextarea.value = JSON.stringify(defaultOrder, null, 2);
    orderField.appendChild(orderTextarea);
    startPanel.appendChild(orderField);

    var startBtn = makeButton("ابدأ المكالمة (/start)");
    var sessionPill = document.createElement("span");
    sessionPill.className = "session-pill";
    sessionPill.innerHTML = 'الجلسة: <span class="val"></span>';
    startPanel.appendChild(makeActionsRow(startBtn, sessionPill));
    container.appendChild(startPanel);

    /* ---- سجل المكالمة (يتراكم عبر الأدوار) ---- */
    var callPanel = makePanel("مجرى المكالمة");
    var callMeta = document.createElement("div");
    callMeta.className = "response-meta";
    var callBody = document.createElement("div");
    callBody.innerHTML = '<div class="empty-state">عدّل بيانات الشحنة (أو اتركها) واضغط "ابدأ المكالمة".</div>';
    callPanel.appendChild(callMeta);
    callPanel.appendChild(callBody);
    container.appendChild(callPanel);

    // يضيف فقاعة واحدة لسجل المكالمة، مع مشغّل صوت إن وُجد.
    function addBubble(cls, who, text, audioUrl, autoplay) {
      var b = document.createElement("div");
      b.className = "bubble " + cls;
      b.innerHTML = '<div class="who">' + escapeHtml(who) + "</div>" + escapeHtml(text || "—");
      if (audioUrl) {
        var a = document.createElement("audio");
        a.controls = true;
        a.autoplay = !!autoplay;
        a.src = audioUrl;
        a.style.width = "100%";
        a.style.marginTop = "8px";
        b.appendChild(a);
      }
      callBody.appendChild(b);
      b.scrollIntoView({ block: "nearest" });
    }

    // شريط الحالة أعلى السجل: كود الحالة + الزمن + المرحلة + السبب + القرار.
    function setMeta(status, ms, stage, reason, decision, sent) {
      var html =
        '<span class="status-code ' + statusClass(status) + '">' + status + "</span>" +
        '<span class="latency">' + ms + " ms</span>";
      if (stage) html += '<span class="engine-pill">' + escapeHtml(stage) + "</span>";
      if (reason) html += '<span class="engine-pill">سبب: ' + escapeHtml(reason) + "</span>";
      if (decision) {
        html += '<span class="engine-pill ' + (sent === "true" ? "vllm" : "fallback") + '">' +
          escapeHtml(decision) +
          (sent === "true" ? " · أُرسل" : sent === "false" ? " · تعذّر الإرسال" : "") + "</span>";
      }
      callMeta.innerHTML = html;
    }

    // الهيدرات العربية تصل percent-encoded (RFC 5987) — انظر _ascii_header
    // بـapp/features/voice_return/router.py.
    function decodeHeader(res, name) {
      try { return decodeURIComponent(res.headers.get(name) || ""); } catch (e) { return ""; }
    }

    startBtn.onclick = async function () {
      var payload;
      try {
        payload = JSON.parse(orderTextarea.value);
      } catch (e) {
        alert("JSON غير صالح: " + e.message);
        return;
      }
      startBtn.setBusy(true);
      turnIndex = 0;
      callMeta.innerHTML = "";
      callBody.innerHTML = '<div class="empty-state">جاري توليد جملة الافتتاح (نص → صوت)...</div>';
      var t0 = performance.now();
      try {
        var res = await fetch(baseUrl() + "/voice_return/start", {
          method: "POST",
          headers: Object.assign({ "Content-Type": "application/json" }, apiKeyHeader(ep.apiKeyService)),
          body: JSON.stringify(payload)
        });
        var ms = Math.round(performance.now() - t0);
        if (!res.ok) {
          var errJson = await res.json().catch(function () { return null; });
          setMeta(res.status, ms);
          var msg = (errJson && errJson.detail) || "فشل الطلب";
          callBody.innerHTML = '<div class="empty-state">' + escapeHtml(msg) + "</div>";
          startBtn.setBusy(false);
          return;
        }
        sessionId = res.headers.get("X-Session-Id");
        var openingText = decodeHeader(res, "X-Reply-Text");
        var audioUrl = URL.createObjectURL(await res.blob());

        setMeta(res.status, ms, "awaiting_permission");
        sessionPill.querySelector(".val").textContent = sessionId || "—";
        sessionPill.classList.add("show");
        callBody.innerHTML = "";
        addBubble("assistant", "صباح — الافتتاح", openingText, audioUrl, true);

        turnPanel.style.display = "";
        turnNote.textContent = sessionId
          ? "الجلسة: " + sessionId + " — كرّر إرسال ردود الزبون لين تنتهي المكالمة."
          : "تحذير: ما وصلت session_id بالهيدر — تحقق من Access-Control-Expose-Headers.";
      } catch (e) {
        callMeta.innerHTML = '<span class="status-code s5">خطأ</span>';
        callBody.innerHTML = '<div class="empty-state">تعذّر الوصول للسيرفر: ' + escapeHtml(e.message) + "</div>";
      }
      startBtn.setBusy(false);
    };

    /* ---- الخطوة 2: POST /voice_return/respond (تتكرر كل دور) ---- */
    var turnPanel = makePanel("الخطوة ٢ — رد الزبون (يتكرر كل دور)");
    turnPanel.style.display = "none";
    var turnNote = document.createElement("div");
    turnNote.style.fontSize = "12.5px";
    turnNote.style.color = "var(--text-dim)";
    turnNote.style.marginBottom = "10px";
    turnPanel.appendChild(turnNote);

    var recordRow = document.createElement("div");
    recordRow.className = "radio-row";
    var recordBtn = document.createElement("button");
    recordBtn.className = "ghost";
    recordBtn.type = "button";
    recordBtn.textContent = "🎙 سجّل رد الزبون";
    var recordStatus = document.createElement("span");
    recordStatus.style.fontSize = "12.5px";
    recordStatus.style.color = "var(--text-dim)";
    recordStatus.style.alignSelf = "center";
    recordRow.appendChild(recordBtn);
    recordRow.appendChild(recordStatus);
    turnPanel.appendChild(recordRow);

    var fileArea = document.createElement("div");
    fileArea.className = "field";
    fileArea.style.marginTop = "12px";
    fileArea.innerHTML = '<label>أو ارفع ملف صوتي جاهز (wav/mp3/m4a)</label>';
    var fileDrop = document.createElement("div");
    fileDrop.className = "file-drop";
    var fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "audio/*";
    fileDrop.appendChild(fileInput);
    fileArea.appendChild(fileDrop);
    turnPanel.appendChild(fileArea);

    var recordedPreview = document.createElement("audio");
    recordedPreview.controls = true;
    recordedPreview.style.width = "100%";
    recordedPreview.style.marginTop = "10px";
    recordedPreview.style.display = "none";
    turnPanel.appendChild(recordedPreview);

    var recordedBlob = null;
    var mediaRecorder = null;
    var mediaChunks = [];
    recordBtn.onclick = async function () {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }
      try {
        var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = function (e) { if (e.data.size > 0) mediaChunks.push(e.data); };
        mediaRecorder.onstop = function () {
          recordedBlob = new Blob(mediaChunks, { type: "audio/webm" });
          recordedPreview.src = URL.createObjectURL(recordedBlob);
          recordedPreview.style.display = "";
          recordBtn.textContent = "🎙 سجّل رد الزبون";
          recordStatus.textContent = "تسجيل جاهز (" + Math.round(recordedBlob.size / 1024) + " كيلوبايت).";
          stream.getTracks().forEach(function (t) { t.stop(); });
        };
        mediaRecorder.start();
        recordBtn.textContent = "⏹ إيقاف التسجيل";
        recordStatus.textContent = "جاري التسجيل...";
      } catch (e) {
        recordStatus.textContent = "تعذّر الوصول للمايكروفون: " + e.message;
      }
    };

    var turnBtn = makeButton("أرسل الدور (/respond)");
    turnPanel.appendChild(makeActionsRow(turnBtn));
    container.appendChild(turnPanel);

    turnBtn.onclick = async function () {
      if (!sessionId) { alert("ابدأ المكالمة أولاً (/start)."); return; }
      var audioFile = fileInput.files[0] || recordedBlob;
      if (!audioFile) { alert("سجّل صوتاً أو ارفع ملفاً أولاً."); return; }

      turnBtn.setBusy(true);
      turnIndex += 1;
      var form = new FormData();
      form.append("audio", audioFile, audioFile.name || "reply.webm");

      var t0 = performance.now();
      try {
        var url = baseUrl() + "/voice_return/respond?session_id=" + encodeURIComponent(sessionId);
        var res = await fetch(url, { method: "POST", headers: apiKeyHeader(ep.apiKeyService), body: form });
        var ms = Math.round(performance.now() - t0);
        if (!res.ok) {
          var errJson = await res.json().catch(function () { return null; });
          setMeta(res.status, ms);
          addBubble("assistant", "خطأ بالدور " + turnIndex, (errJson && errJson.detail) || "فشل الطلب");
          turnBtn.setBusy(false);
          return;
        }
        var transcript = decodeHeader(res, "X-Customer-Transcript");
        var replyText = decodeHeader(res, "X-Reply-Text");
        var callStatus = res.headers.get("X-Call-Status") || "";
        var stage = res.headers.get("X-Call-Stage") || "";
        var reason = res.headers.get("X-Return-Reason") || "";
        var decision = res.headers.get("X-Decision") || "";
        var sent = res.headers.get("X-Result-Sent") || "";
        var audioUrl = URL.createObjectURL(await res.blob());

        setMeta(res.status, ms, stage, reason, decision, sent);
        addBubble("user", "الزبون — دور " + turnIndex + " (Whisper)", transcript || "(سكوت / ما انفهم كلام)");
        addBubble("assistant", "صباح — دور " + turnIndex, replyText, audioUrl, true);

        // نظّف المدخلات حتى ما ينرسل نفس التسجيل بالدور الجاي بالغلط.
        fileInput.value = "";
        recordedBlob = null;
        recordedPreview.style.display = "none";
        recordStatus.textContent = "";

        if (callStatus === "ended") {
          // المكالمة انتهت والجلسة انحذفت بالخادم — نمنع أي دور إضافي.
          sessionId = null;
          sessionPill.classList.remove("show");
          turnPanel.style.display = "none";
          addBubble("assistant", "انتهت المكالمة",
            "القرار النهائي: " + (decision || "—") +
            (sent === "true" ? " — أُرسل لنظام الطلبات."
              : sent === "false" ? " — تعذّر إرساله لنظام الطلبات." : ""));
        }
      } catch (e) {
        callMeta.innerHTML = '<span class="status-code s5">خطأ</span>';
        addBubble("assistant", "خطأ", "تعذّر الوصول للسيرفر: " + e.message);
      }
      turnBtn.setBusy(false);
    };
  }

  /* ---------------- Tool call renderer (شفافية استدعاء الأدوات) ---------------- */
  // toolCalls: [{tool, args, result}] — كما يرجعها app/tool_loop.py ضمن
  // SalesChatResponse.tool_calls / SupportChatResponse.tool_calls. تُعرض
  // كبطاقة صغيرة بين فقاعة العميل وفقاعة الوكيل: اسم الأداة + المعاملات
  // مباشرة، والنتيجة الكاملة مطويّة افتراضياً.
  //
  // ملخّص سطر واحد لكل عنصر نتيجة مبني على عقد باك اند السستم الموثَّق
  // (SystemProduct/SystemOrder — انظر app/system_backend_schema.py وAPI.md
  // § "عقد باك اند السستم") حتى تنقرأ صحة الحقول (سعر/توفر/حالة) بنظرة
  // بلا فتح الـ JSON الكامل.
  function summarizeToolResult(call) {
    var result = call.result;
    if (!result) return "";
    if (result.error) return " · خطأ: " + result.error;
    if (Array.isArray(result.results)) {
      // search_products → SystemProduct[]
      if (!result.results.length) return " · 0 نتيجة";
      var lines = result.results.slice(0, 3).map(function (p) {
        var price = p.price != null ? p.price.toLocaleString() + " " + (p.currency || "") : "بلا سعر";
        var stock = p.in_stock === true ? "متوفر" : p.in_stock === false ? "غير متوفر" : "؟";
        return "- " + (p.name || p.id) + " — " + price + " (" + stock + ")";
      });
      var more = result.results.length > 3 ? "\n… و" + (result.results.length - 3) + " أكثر" : "";
      return { count: result.results.length + " نتيجة", lines: lines.join("\n") + more };
    }
    if (Array.isArray(result.orders)) {
      // get_order_status (all/status/phone) → SystemOrder[]
      if (!result.orders.length) return " · 0 طلب";
      var oLines = result.orders.slice(0, 3).map(function (o) {
        return "- " + o.order_id + " — " + (o.status || "؟") + (o.phone ? " (" + o.phone + ")" : "");
      });
      var oMore = result.orders.length > 3 ? "\n… و" + (result.orders.length - 3) + " أكثر" : "";
      return { count: result.orders.length + " طلب", lines: oLines.join("\n") + oMore };
    }
    if (result.order_id) {
      // get_order_status (order_id) → SystemOrder واحد
      return { count: "طلب واحد", lines: "- " + result.order_id + " — " + (result.status || "؟") };
    }
    return "";
  }

  function renderToolCalls(chatLog, toolCalls) {
    if (!toolCalls || !toolCalls.length) return;
    toolCalls.forEach(function (call) {
      var box = document.createElement("div");
      box.className = "tool-call";
      var summary = summarizeToolResult(call);
      var countLabel = typeof summary === "string" ? summary : " · " + summary.count;
      var previewLines = typeof summary === "object" ? summary.lines : "";
      box.innerHTML =
        '<div class="head">🔧 استدعى الأداة ' +
        '<span class="tool-name">' + escapeHtml(call.tool || "؟") + "</span>" +
        '<span class="tool-args">' + escapeHtml(JSON.stringify(call.args || {})) + "</span>" +
        '<span>' + escapeHtml(countLabel) + "</span></div>" +
        (previewLines ? '<pre class="json-view" style="margin-top:6px;">' + escapeHtml(previewLines) + "</pre>" : "") +
        "<details><summary>عرض نتيجة الأداة كاملة (JSON)</summary>" +
        '<pre class="json-view">' + highlightJson(call.result) + "</pre></details>";
      chatLog.appendChild(box);
    });
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  /* ---------------- Order card renderer ---------------- */
  function renderOrderCard(order) {
    var card = document.createElement("div");
    card.className = "order-card";
    var rowsHtml = (order.items || []).map(function (it) {
      return "<tr><td>" + escapeHtml(it.product_name) +
        (it.matched ? "" : " ⚠") +
        "</td><td class=\"num\">×" + it.quantity + "</td><td class=\"num\">" +
        (it.line_total != null ? it.line_total.toLocaleString() + " " + (it.currency || "") : "—") +
        "</td></tr>";
    }).join("");
    card.innerHTML =
      "<h3>✓ طلب مؤكَّد — " + escapeHtml(order.order_id || "") + "</h3>" +
      "<table>" + rowsHtml + "</table>" +
      (order.total != null
        ? '<div style="margin-top:8px;font-weight:600;">المجموع: <span class="num">' +
          order.total.toLocaleString() + " " + (order.currency || "") + "</span></div>"
        : "") +
      '<div style="margin-top:6px;color:var(--text-dim);">' + escapeHtml(order.confirmation_message || "") + "</div>" +
      // خانة مستقلة للـ JSON الكامل: البطاقة أعلاه ملخّص للقراءة السريعة،
      // وهذي هي الحمولة الفعلية اللي تنرسل لنظام الطلبات — مطويّة افتراضياً
      // حتى ما تزحم البطاقة، ومعها زر نسخ للصقها بأي أداة.
      '<details class="order-json">' +
        "<summary>JSON الطلب الكامل" +
          '<button type="button" class="copy-json">نسخ</button>' +
        "</summary>" +
        '<pre class="json-view">' + highlightJson(order) + "</pre>" +
      "</details>";

    var copyBtn = card.querySelector(".copy-json");
    copyBtn.addEventListener("click", function (ev) {
      // بدون هذا ينفتح/ينطوي <details> عند الضغط على زر النسخ.
      ev.preventDefault();
      ev.stopPropagation();
      var text = JSON.stringify(order, null, 2);
      var done = function () {
        copyBtn.textContent = "✓ اننسخ";
        setTimeout(function () { copyBtn.textContent = "نسخ"; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
      } else {
        fallbackCopy(text, done);
      }
    });
    return card;
  }

  function fallbackCopy(text, onDone) {
    // clipboard API يحتاج سياقاً آمناً (https أو localhost) — بالوصول للسيرفر
    // عبر IP أو بروكسي http يفشل، فنرجع للطريقة القديمة بدل ما ينكسر الزر.
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); onDone(); } catch (e) {}
    document.body.removeChild(ta);
  }

  /* ---------------- Init ---------------- */
  var lastId = null;
  try { lastId = localStorage.getItem("iraqi_last_endpoint"); } catch (e) {}
  selectEndpoint(endpoints.some(function (e) { return e.id === lastId; }) ? lastId : "health");
  pingServer();
})();
</script>
